name: Rust lint setup
description: >
  Install the stable Rust toolchain and write the per-OS linker config used by
  the Linting jobs in ci.yml. Identical to the inline setup steps in the other
  ci.yml jobs; it exists so the lint jobs, which were split so they run in
  parallel, do not each carry another copy of those steps.

runs:
  using: composite
  steps:
    - name: Install Rust toolchain (Linux/macOS)
      if: runner.os != 'Windows'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Configure Rust to use LLD (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        if not exist "%USERPROFILE%\.cargo" mkdir "%USERPROFILE%\.cargo"
        set "configPath=%USERPROFILE%\.cargo\config.toml"
        if exist "%configPath%" del "%configPath%"
        echo [target.x86_64-pc-windows-msvc] >> "%configPath%"
        echo linker = "lld-link.exe" >> "%configPath%"
        echo rustflags = ["-C", "link-arg=/STACK:16777216"] >> "%configPath%"

    - name: Configure Rust to use LLD (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p ~/.cargo
        rm -f ~/.cargo/config.toml
        echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
        echo 'linker = "clang"' >> ~/.cargo/config.toml
        echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml

    # See the macOS linker note on the same step in ci.yml's `test-rust` job:
    # `-A linker_messages` silences ld64's benign "__eh_frame section too
    # large" warning, and no custom linker flags are set because the ones
    # tried (`-undefined dynamic_lookup`, `-stack_size`) broke the build.
    - name: Configure Rust linker (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        mkdir -p ~/.cargo
        rm -f ~/.cargo/config.toml
        echo '[target.aarch64-apple-darwin]' >> ~/.cargo/config.toml
        echo 'linker = "clang"' >> ~/.cargo/config.toml
        echo 'rustflags = ["-A", "linker_messages"]' >> ~/.cargo/config.toml
