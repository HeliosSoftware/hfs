name: Docker host GC
description: >
  Reclaim space on the shared remote Docker host. Runs at the end of every
  workflow that stands up testcontainers, so the host is swept many times a day
  rather than once a night.

# Why this is a per-run step and not a scheduled janitor: the host is shared by
# every concurrent CI run, and it fills during the working day. A nightly cron
# cannot help a run that dies at 16:03 — by the time the sweep fires the damage
# is twelve hours old and several runs have already gone red. Sweeping after
# each run keeps the quota from ever being approached.
#
# Everything here is safe to run WHILE other runs are in flight, which is the
# constraint that shapes every filter below:
#   - volumes: only unreferenced ones are touched, and a live container's
#     volumes are by definition referenced.
#   - images: `until` protects anything pulled recently, including an image a
#     concurrent run has pulled but not yet started a container from.
#   - build cache / networks: age- and size-guarded for the same reason.

inputs:
  image-min-age:
    description: Only prune unused images older than this (docker `until` filter).
    required: false
    default: 48h
  builder-keep-storage:
    description: Build cache to retain as a warm cache.
    required: false
    default: 20GB
  container-max-age-min:
    description: >
      Age (minutes) past which a container labelled `hfs-ci=true` is treated as
      an orphan and force-removed. Must comfortably exceed the longest CI job
      runtime so a concurrent run is never reaped mid-test.
    required: false
    default: "180"

runs:
  using: composite
  steps:
    - name: Docker disk usage before GC
      shell: bash
      run: docker system df || true

    # Volumes FIRST, and every step non-fatal. On a host already at its quota
    # even image *deletion* fails, because containerd needs a meta.db write to
    # do it — while volume removal frees the same filesystem without one. The
    # 2026-07 incident hit exactly this: image prunes erroring out while
    # thousands of orphaned testcontainer volumes held the bulk of the usage.
    # Free the bulk first and the rest starts working again.
    - name: Remove orphaned anonymous volumes
      shell: bash
      run: |
        # Deliberately NOT `docker volume prune -af`. `-a` includes *named*
        # volumes, so a prune racing a service redeploy — at the moment that
        # service's named volume is briefly unreferenced — would delete its
        # data, with no undo.
        #
        # Verified 2026-07-30: the host currently has *no* named volumes at all,
        # so today the two forms would behave identically. The narrower filter
        # is defence in depth, not a response to something already at risk: the
        # host does run long-lived services alongside CI, and the day one of
        # them gains a named volume, that must not silently turn a routine
        # sweep into data loss.
        #
        # Anonymous volumes (the only kind testcontainers leaks) are named with
        # a 64-char hex string; named volumes never match that shape. Matching
        # on it removes exactly the leak and structurally cannot touch anything
        # a human named. This is also version-independent: the meaning of
        # `volume prune` without `-a` changed in Docker 23, the hex shape did not.
        #
        # `|| true` guards the pipeline because `grep` exits 1 on no matches and
        # these steps run under `set -o pipefail`.
        before=$(docker volume ls -qf dangling=true | grep -cE '^[0-9a-f]{64}$' || true)
        docker volume ls -qf dangling=true \
          | grep -E '^[0-9a-f]{64}$' \
          | xargs -r docker volume rm -f >/dev/null 2>&1 || true
        after=$(docker volume ls -qf dangling=true | grep -cE '^[0-9a-f]{64}$' || true)
        echo "Orphaned anonymous volumes: ${before} before, ${after} after."
        # A volume still in use by a concurrently starting container refuses
        # removal; that is the intended outcome, not an error worth failing on.

    # Containers SECOND: after the volume sweep (which is what unwedges a
    # quota-choked host) and before the image prune (which a surviving
    # container would otherwise block by holding a reference to its image).
    #
    # This exists because `if: always()` cleanup is not enough. When the host
    # hit its quota on 2026-07-30, containerd could not write meta.db, so the
    # per-job `docker rm -f` failed too — and because those steps discarded
    # stderr and ended in `|| true`, they reported success while leaking a
    # running Playwright container. It then survived two weeks: its name is
    # run-id-scoped so no later run could match it, it carried no
    # testcontainers label so ci.yml's sweeps could not see it, and nothing
    # here pruned containers at all. It also pinned the ~2GB Playwright image
    # against `image prune`, so the leak actively degraded this very sweep.
    #
    # Scoped to the `hfs-ci=true` label rather than a blanket
    # `docker container prune`: the host runs long-lived services alongside CI,
    # and a stopped container a human intends to restart must never be
    # collected by a routine sweep. Same defence-in-depth reasoning as the
    # anonymous-volume filter above — the sweep should be structurally
    # incapable of touching anything a person owns.
    - name: Reap orphaned CI containers
      shell: bash
      run: |
        # Not `$(docker ps ... || true)`: if the daemon cannot even list
        # containers, an empty list would print "Reaped 0" and read as a clean
        # sweep — the exact silent-success pattern that hid the original leak.
        if ! ids=$(docker ps -aq --filter "label=hfs-ci=true"); then
          echo "::warning::Could not list containers on the Docker host; orphan sweep skipped."
          exit 0
        fi

        now=$(date +%s)
        reaped=0
        for id in $ids; do
          started=$(docker inspect -f '{{.State.StartedAt}}' "$id" 2>/dev/null) || continue
          age_min=$(( (now - $(date -d "$started" +%s)) / 60 ))
          if [ "$age_min" -ge "${{ inputs.container-max-age-min }}" ]; then
            name=$(docker inspect -f '{{.Name}}' "$id" 2>/dev/null || echo "$id")
            echo "Reaping orphan ${name#/} (age ${age_min}m)"
            # -v for the same reason as the volume sweep: the container's
            # anonymous volumes go with it, in one write, on a host where
            # writes are the scarce resource.
            docker rm -fv "$id" || true
            reaped=$((reaped + 1))
          fi
        done
        echo "Reaped ${reaped} orphaned CI container(s)."

    - name: Prune stale images, build cache and networks
      shell: bash
      run: |
        # Age filters keep a warm pull cache for the heavy images the nightly
        # suites depend on (Playwright, Elasticsearch, Postgres, Mongo). Without
        # them every run would re-pull gigabytes and get slower, trading one
        # problem for another.
        docker image prune -af --filter "until=${{ inputs.image-min-age }}" || true

        # `--keep-storage` was renamed `--reserved-space`; the old spelling is
        # deprecated and warns. The flag is parsed by the *client*, not the
        # remote daemon, so the runner pool decides which name works and the
        # pool is not uniform — probe rather than pin.
        if docker builder prune --help 2>&1 | grep -q -- '--reserved-space'; then
          docker builder prune -af --reserved-space "${{ inputs.builder-keep-storage }}" || true
        else
          docker builder prune -af --keep-storage "${{ inputs.builder-keep-storage }}" || true
        fi

        docker network prune -f --filter "until=6h" || true

    - name: Docker disk usage after GC
      shell: bash
      run: docker system df || true
