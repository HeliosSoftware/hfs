name: Inferno US Core Test Suite

on:
  workflow_dispatch: # Manual trigger only for initial implementation

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  HFS_PORT: 8088
  # Remote Docker host (set via GitHub repository secrets or variables; leave unset for local Docker)
  DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
  DOCKER_HOST_IP: ${{ secrets.DOCKER_HOST_IP }}
  # S3+Elasticsearch backend configuration (optional; s3-elasticsearch tests are skipped when not set)
  HFS_S3_BUCKET: ${{ secrets.HFS_S3_BUCKET }}

jobs:
  build:
    name: Build HFS
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust to use LLD
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml

      - name: Build HFS
        run: cargo build -p helios-hfs --features R4,sqlite,elasticsearch,postgres,mongodb,s3

      - name: Upload HFS binary
        uses: actions/upload-artifact@v7
        with:
          name: hfs-binary
          path: target/debug/hfs
          retention-days: 1

  inferno-stack-up:
    name: Start Shared Inferno Stack
    runs-on: [self-hosted, Linux]
    outputs:
      port: ${{ steps.up.outputs.port }}
      project: ${{ steps.up.outputs.project }}
    steps:
      - name: Checkout us-core-test-kit
        uses: actions/checkout@v5
        with:
          repository: HeliosSoftware/us-core-test-kit
          path: us-core-test-kit

      - name: Run setup.sh under shared compose project
        working-directory: us-core-test-kit
        env:
          COMPOSE_PROJECT_NAME: inferno-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -x ./setup.sh ]; then
            ./setup.sh
          else
            echo "No setup.sh found in test-kit checkout, skipping"
          fi

      - name: Bring up shared Inferno stack
        id: up
        working-directory: us-core-test-kit
        run: |
          PROJECT="inferno-${{ github.run_id }}-${{ github.run_attempt }}"

          # The upstream compose file bind-mounts ./config/nginx.conf from the
          # runner's filesystem. With a remote DOCKER_HOST that path doesn't
          # exist on the daemon — Docker auto-creates the missing source as a
          # directory, which then can't be mounted onto a file. Bake the
          # config into a one-off CI image instead, and assign an ephemeral
          # nginx host port so the stack can coexist on a shared Docker host.
          # (The validator's ./data/igs bind-mount is fine to leave: data/igs
          # is just a .keep upstream, so the auto-created empty dir matches
          # what the validator would see in a fresh checkout anyway.)
          mkdir -p ci-images/nginx
          cat > ci-images/nginx/Dockerfile <<'EOF'
          FROM nginx
          COPY config/nginx.conf /etc/nginx/nginx.conf
          EOF
          cat > docker-compose.override.yml <<'EOF'
          services:
            nginx:
              image: !reset null
              build:
                context: .
                dockerfile: ci-images/nginx/Dockerfile
              volumes: !override []
              ports: !override
                - "0:80"
            redis:
              ports: !override []
          EOF

          docker compose -p "$PROJECT" up -d

          INFERNO_PORT=$(docker compose -p "$PROJECT" port nginx 80 | head -1 | sed 's/.*://')
          if [ -z "$INFERNO_PORT" ]; then
            echo "Failed to discover Inferno host port"
            docker compose -p "$PROJECT" ps
            docker compose -p "$PROJECT" logs --tail 200
            exit 1
          fi

          INFERNO_HOST="${DOCKER_HOST_IP:-localhost}"
          echo "Waiting for Inferno test kit to respond on $INFERNO_HOST:$INFERNO_PORT..."
          for i in {1..60}; do
            if curl -sf "http://$INFERNO_HOST:$INFERNO_PORT/api/test_suites" > /dev/null 2>&1; then
              echo "Inferno is ready"
              echo "port=$INFERNO_PORT" >> $GITHUB_OUTPUT
              echo "project=$PROJECT" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i/60: Inferno not ready yet..."
            sleep 2
          done
          echo "Inferno is not reachable at http://$INFERNO_HOST:$INFERNO_PORT"
          docker compose -p "$PROJECT" ps
          docker compose -p "$PROJECT" logs --tail 200
          exit 1

  inferno-test:
    name: Inferno US Core ${{ matrix.version_label }} Tests (${{ matrix.backend }})
    needs: [build, inferno-stack-up]
    runs-on: [self-hosted, Linux]
    env:
      INFERNO_PORT: ${{ needs.inferno-stack-up.outputs.port }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite_id:
          [
            us_core_v311,
            us_core_v400,
            us_core_v501,
            us_core_v610,
            us_core_v700,
            us_core_v800,
          ]
        backend: [sqlite, sqlite-elasticsearch, postgres, mongodb, s3-elasticsearch]
        include:
          - { suite_id: us_core_v311, version_label: "v3.1.1" }
          - { suite_id: us_core_v400, version_label: "v4.0.0" }
          - { suite_id: us_core_v501, version_label: "v5.0.1" }
          - { suite_id: us_core_v610, version_label: "v6.1.0" }
          - { suite_id: us_core_v700, version_label: "v7.0.0" }
          - { suite_id: us_core_v800, version_label: "v8.0.0" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download HFS binary
        uses: actions/download-artifact@v8
        with:
          name: hfs-binary
          path: target/debug

      - name: Make HFS binary executable
        run: chmod +x target/debug/hfs

      - name: Validate backend configuration
        run: |
          if [ "${{ matrix.backend }}" = "s3-elasticsearch" ] && [ -z "$HFS_S3_BUCKET" ]; then
            echo "::error::s3-elasticsearch backend requires HFS_S3_BUCKET to be configured"
            exit 1
          fi

      - name: Determine runner IP
        run: |
          # Get the runner's IP so the persistent Inferno container can reach HFS on this runner.
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "Runner IP: $RUNNER_IP"

      - name: Set version-specific variables
        run: |
          SUITE=${{ matrix.suite_id }}
          echo "TEST_GROUP_ID=${SUITE}-${SUITE}_fhir_api" >> $GITHUB_ENV

          # CapabilityStatement tests: server doesn't yet declare US Core profiles/instantiates
          OMITTED="\"${SUITE}-${SUITE}_fhir_api-${SUITE}_capability_statement-us_core_conformance_support\""
          OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_capability_statement-us_core_profile_support\""
          OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_capability_statement-us_core_instantiate\""
          # TLS test: HFS does not serve HTTPS
          OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_capability_statement-standalone_auth_tls\""
          # DataAbsentReason: test data does not include DAR extensions/code systems
          # Note: Inferno uses "us_core_311" naming for this group across all US Core versions
          OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-us_core_311_data_absent_reason-us_core_311_data_absent_reason_extension\""
          OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-us_core_311_data_absent_reason-us_core_311_data_absent_reason_code_system\""
          # smokingstatus/simple-observation: shared test data references SNOMED CT US-edition version (731000124108) not in International Edition; Inferno validator can't resolve it.
          # The offending bundle (uscore_bundle_patient_client_test.json) is loaded for every suite, so omit across all versions.
          OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_smokingstatus-${SUITE}_smokingstatus_validation_test\""
          OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_simple_observation-${SUITE}_simple_observation_validation_test\""

          case "$SUITE" in
            us_core_v501|us_core_v610|us_core_v700|us_core_v800)
              # ServiceRequest uses US-edition SNOMED code (467771000124109) not in International Edition; Inferno validator can't resolve it
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_service_request-${SUITE}_service_request_validation_test\""
              ;;
          esac

          case "$SUITE" in
            us_core_v610|us_core_v700|us_core_v800)
              # No Practitioner references found in test data for these versions
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_practitioner-${SUITE}_practitioner_address_test\""
              ;;
          esac

          case "$SUITE" in
            us_core_v700|us_core_v800)
              # Inferno fhir_client gem bug with UUID-based Location references
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_location-${SUITE}_location_address_search_test\""
              ;;
          esac

          case "$SUITE" in
            us_core_v501)
              # ObservationSocialHistory: shared test data does not conform to v5.0.1 profile slicing
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_observation_social_history-${SUITE}_observation_social_history_validation_test\""
              ;;
          esac

          case "$SUITE" in
            us_core_v610|us_core_v700|us_core_v800)
              # ObservationPregnancyIntent / ObservationPregnancyStatus: shared test data carries the unversioned profile URL and does not conform to the v6.1.0+ versioned profile slicing
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_observation_pregnancyintent-${SUITE}_observation_pregnancyintent_validation_test\""
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_observation_pregnancystatus-${SUITE}_observation_pregnancystatus_validation_test\""
              ;;
          esac

          case "$SUITE" in
            us_core_v700|us_core_v800)
              # Specimen: shared test data does not conform to v7.0.0+ profile slicing
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_specimen-${SUITE}_specimen_validation_test\""
              ;;
          esac

          case "$SUITE" in
            us_core_v800)
              # v8.0.0 changed us-core-sex extension type from code to Coding; shared test data uses valueCode (correct for v6.1.0/v7.0.0)
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_patient-${SUITE}_patient_validation_test\""
              # QuestionnaireResponse linkId text must match referenced Questionnaire definition
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_questionnaire_response-${SUITE}_questionnaire_response_validation_test\""
              # ObservationADIDocumentation: shared test data does not conform to v8.0.0 profile slicing (introduced in v8)
              OMITTED="${OMITTED},\"${SUITE}-${SUITE}_fhir_api-${SUITE}_observation_adi_documentation-${SUITE}_observation_adi_documentation_validation_test\""
              ;;
          esac

          echo "OMITTED_TESTS=[${OMITTED}]" >> $GITHUB_ENV

      - name: Start MongoDB replica set
        if: matrix.backend == 'mongodb'
        run: |
          MONGO_CONTAINER="mongo-${{ matrix.suite_id }}-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}"
          docker rm -f "$MONGO_CONTAINER" 2>/dev/null || true
          docker run -d --name "$MONGO_CONTAINER" -p 0:27017 mongo:7.0 --replSet rs0 --bind_ip_all

          echo "MONGO_CONTAINER=$MONGO_CONTAINER" >> $GITHUB_ENV

          READY=0
          for i in {1..30}; do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' > /dev/null 2>&1; then
              READY=1
              break
            fi
            echo "Attempt $i/30: MongoDB not ready yet..."
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "MongoDB failed to start"
            docker logs "$MONGO_CONTAINER"
            exit 1
          fi

          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }' > /dev/null 2>&1

          echo "Waiting for MongoDB replica set primary..."
          for i in {1..60}; do
            PRIMARY_STATE=$(docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'try { rs.status().myState } catch (e) { 0 }' | tr -d '\r\n ')
            if [ "$PRIMARY_STATE" = "1" ]; then
              MONGO_PORT=$(docker port "$MONGO_CONTAINER" 27017 | head -1 | sed 's/.*://')
              echo "MongoDB replica set is ready on port $MONGO_PORT"
              echo "MONGO_PORT=$MONGO_PORT" >> $GITHUB_ENV
              exit 0
            fi
            echo "Attempt $i/60: MongoDB replica set not primary yet..."
            sleep 2
          done

          echo "MongoDB replica set failed to become primary"
          docker logs "$MONGO_CONTAINER"
          exit 1

      - name: Start Elasticsearch
        if: matrix.backend == 'sqlite-elasticsearch' || matrix.backend == 's3-elasticsearch'
        run: |
          ES_CONTAINER="es-${{ matrix.suite_id }}-${{ matrix.backend }}"
          docker rm -f $ES_CONTAINER 2>/dev/null || true
          docker run -d --name $ES_CONTAINER -p 0:9200 \
            -e "discovery.type=single-node" \
            -e "xpack.security.enabled=false" \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            elasticsearch:8.15.0

          echo "ES_CONTAINER=$ES_CONTAINER" >> $GITHUB_ENV

          echo "Waiting for Elasticsearch to be ready..."
          for i in {1..30}; do
            ES_PORT=$(docker port $ES_CONTAINER 9200 2>/dev/null | head -1 | sed 's/.*://')
            if [ -n "$ES_PORT" ]; then
              if curl -sf http://$DOCKER_HOST_IP:$ES_PORT/_cluster/health > /dev/null 2>&1; then
                echo "Elasticsearch is ready on port $ES_PORT"
                echo "ES_PORT=$ES_PORT" >> $GITHUB_ENV
                exit 0
              fi
            fi
            echo "Attempt $i/30: Elasticsearch not ready yet..."
            sleep 2
          done
          echo "Elasticsearch failed to start"
          docker logs $ES_CONTAINER
          exit 1

      - name: Start PostgreSQL
        if: matrix.backend == 'postgres'
        run: |
          PG_CONTAINER="pg-${{ matrix.suite_id }}"
          docker rm -f $PG_CONTAINER 2>/dev/null || true
          docker run -d --name $PG_CONTAINER -p 0:5432 \
            -e POSTGRES_USER=helios \
            -e POSTGRES_PASSWORD=helios \
            -e POSTGRES_DB=helios \
            postgres:16

          echo "PG_CONTAINER=$PG_CONTAINER" >> $GITHUB_ENV

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec $PG_CONTAINER pg_isready -U helios > /dev/null 2>&1; then
              PG_PORT=$(docker port $PG_CONTAINER 5432 | head -1 | sed 's/.*://')
              # Verify external TCP connectivity to the mapped port, not just internal readiness
              if timeout 2 bash -c "cat < /dev/null > /dev/tcp/$DOCKER_HOST_IP/$PG_PORT" 2>/dev/null; then
                echo "PostgreSQL is ready on port $PG_PORT"
                echo "PG_PORT=$PG_PORT" >> $GITHUB_ENV
                exit 0
              fi
            fi
            echo "Attempt $i/30: PostgreSQL not ready yet..."
            sleep 2
          done
          echo "PostgreSQL failed to start"
          docker logs $PG_CONTAINER
          exit 1

      - name: Configure AWS credentials
        if: matrix.backend == 's3-elasticsearch'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install AWS CLI
        if: matrix.backend == 's3-elasticsearch'
        run: |
          if ! command -v aws &>/dev/null; then
            if ! /tmp/aws-bin/aws --version &>/dev/null; then
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -qo /tmp/awscliv2.zip -d /tmp
              /tmp/aws/install --install-dir /tmp/aws-cli --bin-dir /tmp/aws-bin --update
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi
            echo "/tmp/aws-bin" >> $GITHUB_PATH
          fi
          aws --version 2>/dev/null || /tmp/aws-bin/aws --version

      - name: Empty S3 prefix
        if: matrix.backend == 's3-elasticsearch'
        run: |
          BUCKET="${{ secrets.HFS_S3_BUCKET }}"
          PREFIX="ci/${{ matrix.suite_id }}/"
          echo "Emptying s3://$BUCKET/$PREFIX"
          aws s3 rm "s3://$BUCKET/$PREFIX" --recursive
          echo "Prefix emptied"

      - name: Start HFS server
        run: |
          HFS_LOG="/tmp/hfs-${{ matrix.suite_id }}-${{ matrix.backend }}.log"
          echo "HFS_LOG=$HFS_LOG" >> $GITHUB_ENV

          if [ "${{ matrix.backend }}" = "sqlite-elasticsearch" ]; then
            HFS_STORAGE_BACKEND=sqlite-elasticsearch \
            HFS_ELASTICSEARCH_NODES=http://$DOCKER_HOST_IP:$ES_PORT \
            ./target/debug/hfs --database-url :memory: --log-level info --port $HFS_PORT --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          elif [ "${{ matrix.backend }}" = "postgres" ]; then
            HFS_STORAGE_BACKEND=postgres \
            HFS_PG_HOST=$DOCKER_HOST_IP \
            HFS_PG_PORT=$PG_PORT \
            HFS_PG_DBNAME=helios \
            HFS_PG_USER=helios \
            HFS_PG_PASSWORD=helios \
            ./target/debug/hfs --log-level info --port $HFS_PORT --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          elif [ "${{ matrix.backend }}" = "mongodb" ]; then
            MONGO_HOST="${DOCKER_HOST_IP:-127.0.0.1}"
            HFS_STORAGE_BACKEND=mongodb \
            HFS_DATABASE_URL="mongodb://$MONGO_HOST:$MONGO_PORT/?replicaSet=rs0&directConnection=true" \
            HFS_MONGODB_DATABASE="helios_inferno_${{ matrix.suite_id }}_${{ github.run_id }}_${{ github.run_attempt }}" \
            ./target/debug/hfs --log-level info --port $HFS_PORT --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          elif [ "${{ matrix.backend }}" = "s3-elasticsearch" ]; then
            HFS_STORAGE_BACKEND=s3-elasticsearch \
            HFS_S3_BUCKET=${{ secrets.HFS_S3_BUCKET }} \
            HFS_S3_PREFIX=ci/${{ matrix.suite_id }}/ \
            HFS_S3_VALIDATE_BUCKETS=false \
            HFS_ELASTICSEARCH_NODES=http://$DOCKER_HOST_IP:$ES_PORT \
            ./target/debug/hfs --log-level info --port $HFS_PORT --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          else
            ./target/debug/hfs --database-url :memory: --log-level info --port $HFS_PORT --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          fi
          echo $! > /tmp/hfs.pid
          echo "HFS_PID=$(cat /tmp/hfs.pid)" >> $GITHUB_ENV

      - name: Wait for HFS to be ready
        run: |
          echo "Waiting for HFS to start..."
          for i in {1..30}; do
            # Check if the HFS process is still alive
            if ! kill -0 $HFS_PID 2>/dev/null; then
              echo "HFS process ($HFS_PID) has exited!"
              echo "=== HFS log output ==="
              cat "$HFS_LOG"
              echo "=== end of log ==="
              exit 1
            fi
            if curl -sf http://localhost:$HFS_PORT/health > /dev/null 2>&1; then
              echo "HFS is ready"
              exit 0
            fi
            echo "Attempt $i/30: HFS not ready yet..."
            sleep 2
          done
          echo "HFS failed to start (process still running but not responding)"
          echo "=== Last 50 lines of HFS log ==="
          tail -50 "$HFS_LOG"
          echo "=== end of log ==="
          exit 1

      - name: Load Inferno test data into HFS
        run: |
          ./crates/hfs/tests/inferno/install.sh || {
            echo "=== HFS log output ==="
            cat "$HFS_LOG"
            echo "=== end of log ==="
            exit 1
          }

      - name: Refresh Elasticsearch indices
        # ES indexes asynchronously (default refresh_interval=1s). The data load
        # returns as soon as HFS finishes writing, but the first search may run
        # before ES has refreshed, producing missing-data failures. Force a
        # refresh on all hfs_* indices so the first test batch sees fresh data.
        if: matrix.backend == 'sqlite-elasticsearch' || matrix.backend == 's3-elasticsearch'
        run: |
          curl -sf -X POST "http://$DOCKER_HOST_IP:$ES_PORT/hfs_*/_refresh" > /dev/null \
            || echo "::warning::Elasticsearch refresh request did not return success — proceeding anyway"

      - name: Sanity-check shared Inferno stack
        run: |
          INFERNO_HOST="${DOCKER_HOST_IP:-localhost}"
          echo "INFERNO_HOST=$INFERNO_HOST" >> $GITHUB_ENV
          if ! curl -sf "http://$INFERNO_HOST:$INFERNO_PORT/api/test_suites" > /dev/null; then
            echo "Shared Inferno stack not reachable at http://$INFERNO_HOST:$INFERNO_PORT"
            exit 1
          fi

      - name: Create results directory
        run: mkdir -p inferno-results

      - name: Run Inferno tests
        run: |
          # Create a test session for US Core ${{ matrix.version_label }}
          # Retry to handle Inferno's SQLite "database is locked" errors under concurrent load
          echo "Creating test session for ${{ matrix.suite_id }}..."
          for attempt in $(seq 1 5); do
            SESSION_RESPONSE=$(curl -s -X POST "http://$INFERNO_HOST:$INFERNO_PORT/api/test_sessions?test_suite_id=${{ matrix.suite_id }}")
            SESSION_ID=$(echo "$SESSION_RESPONSE" | jq -r '.id' 2>/dev/null) || true

            if [ -n "$SESSION_ID" ] && [ "$SESSION_ID" != "null" ]; then
              break
            fi
            echo "Attempt $attempt/5: Failed to create test session: $SESSION_RESPONSE"
            sleep $((attempt * 3))
          done

          if [ -z "$SESSION_ID" ] || [ "$SESSION_ID" = "null" ]; then
            echo "Failed to create test session after 5 attempts"
            echo "$SESSION_RESPONSE"
            exit 1
          fi

          echo "Test session created: $SESSION_ID"
          echo "$SESSION_RESPONSE" > inferno-results/session.json

          # Start the test run
          # Note: RUNNER_IP is used so the Inferno container can reach HFS on the runner
          # Note: smart_auth_info with auth_type=public allows testing without SMART OAuth
          echo "Starting test run..."
          for attempt in $(seq 1 5); do
            RUN_RESPONSE=$(curl -s -X POST "http://$INFERNO_HOST:$INFERNO_PORT/api/test_runs" \
              -H "Content-Type: application/json" \
              -d "{
                \"test_session_id\": \"$SESSION_ID\",
                \"test_group_id\": \"$TEST_GROUP_ID\",
                \"inputs\": [
                  {\"name\": \"url\", \"value\": \"http://$RUNNER_IP:$HFS_PORT\"},
                  {\"name\": \"patient_ids\", \"value\": \"85,355,907,908,us-core-client-tests-patient\"},
                  {\"name\": \"smart_auth_info\", \"value\": \"{\\\"auth_type\\\":\\\"public\\\"}\"}
                ]
              }")

            RUN_ID=$(echo "$RUN_RESPONSE" | jq -r '.id' 2>/dev/null) || true

            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi
            echo "Attempt $attempt/5: Failed to start test run: $RUN_RESPONSE"
            sleep $((attempt * 3))
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Failed to start test run after 5 attempts"
            echo "$RUN_RESPONSE"
            exit 1
          fi

          echo "Test run started: $RUN_ID"
          echo "$RUN_RESPONSE" > inferno-results/run.json

          # Poll for test run completion
          echo "Polling for results..."
          MAX_POLLS=120
          POLL_INTERVAL=10
          API_ERRORS=0

          for i in $(seq 1 $MAX_POLLS); do
            # Check test run status directly (more reliable than counting results)
            STATUS_RESPONSE=$(curl -s "http://$INFERNO_HOST:$INFERNO_PORT/api/test_runs/$RUN_ID")
            RUN_STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status' 2>/dev/null) || true

            if [ -z "$RUN_STATUS" ] || [ "$RUN_STATUS" = "null" ]; then
              API_ERRORS=$((API_ERRORS + 1))
              echo "Poll $i/$MAX_POLLS: WARNING - Inferno API returned non-JSON (error $API_ERRORS)"
              echo "  Response (first 200 chars): ${STATUS_RESPONSE:0:200}"
              if [ $API_ERRORS -ge 5 ]; then
                echo "ERROR: Inferno API failed $API_ERRORS consecutive times, aborting"
                echo "=== Last 50 lines of HFS log ==="
                tail -50 "$HFS_LOG"
                echo "=== end of log ==="
                exit 1
              fi
              sleep $POLL_INTERVAL
              continue
            fi
            API_ERRORS=0

            # Get results for progress display (filter to individual tests only, not group aggregations)
            RESULTS=$(curl -s "http://$INFERNO_HOST:$INFERNO_PORT/api/test_runs/$RUN_ID/results")
            TOTAL=$(echo "$RESULTS" | jq '[.[] | select(.test_id)] | length' 2>/dev/null) || TOTAL="?"
            PASS=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "pass")] | length' 2>/dev/null) || PASS="?"
            FAIL=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "fail")] | length' 2>/dev/null) || FAIL="?"
            SKIP=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "skip")] | length' 2>/dev/null) || SKIP="?"
            ERROR=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "error")] | length' 2>/dev/null) || ERROR="?"
            OMIT=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "omit")] | length' 2>/dev/null) || OMIT="?"

            echo "Poll $i/$MAX_POLLS: Status=$RUN_STATUS Total=$TOTAL Pass=$PASS Fail=$FAIL Skip=$SKIP Error=$ERROR Omit=$OMIT"

            # Check if test run is complete
            if [ "$RUN_STATUS" = "done" ]; then
              echo "Test run complete!"
              echo "$RESULTS" > inferno-results/results.json
              break
            fi

            if [ $i -eq $MAX_POLLS ]; then
              echo "Test run timed out"
              echo "$RESULTS" > inferno-results/results.json
            fi

            sleep $POLL_INTERVAL
          done

      - name: Check test results
        run: |
          if [ ! -f inferno-results/results.json ]; then
            echo "No results file found"
            exit 1
          fi

          RESULTS=$(cat inferno-results/results.json)

          # Inferno records the same test_id multiple times when a test is part
          # of multiple test groups. Count failures based on the LATEST result
          # for each test_id so transient flakes that subsequently passed do not
          # fail the build.
          LATEST='[.[] | select(.test_id)] | group_by(.test_id) | map(sort_by(.created_at) | last)'

          FAIL=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
            "[$LATEST | .[] | select((.result == \"fail\" or .result == \"error\") and (.test_id | IN(\$omit[]) | not))] | length")
          OMITTED_COUNT=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
            "[$LATEST | .[] | select(.test_id | IN(\$omit[]))] | length")

          echo "Failures (excluding $OMITTED_COUNT omitted tests): $FAIL"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL test(s) failed (excluding omitted)"
            echo "$RESULTS" | jq -r --argjson omit "$OMITTED_TESTS" \
              "$LATEST | .[] | select((.result == \"fail\" or .result == \"error\") and (.test_id | IN(\$omit[]) | not)) | \"  \(.test_id): \(.result) - \(.result_message // \"No message\" | .[0:200])\""
            exit 1
          fi

          echo "All tests passed (with $OMITTED_COUNT omitted)"

      - name: Generate test summary
        if: always()
        run: |
          if [ -f inferno-results/results.json ]; then
            echo "## Inferno US Core ${{ matrix.version_label }} Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            RESULTS=$(cat inferno-results/results.json)

            # Count only the LATEST result for each test_id (Inferno re-runs the
            # same test for every group it belongs to). This matches the build
            # gate in the "Check test results" step.
            LATEST='[.[] | select(.test_id)] | group_by(.test_id) | map(sort_by(.created_at) | last)'

            TOTAL=$(echo "$RESULTS" | jq "[$LATEST | .[]] | length")
            PASS=$(echo "$RESULTS" | jq "[$LATEST | .[] | select(.result == \"pass\")] | length")
            FAIL=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
              "[$LATEST | .[] | select(.result == \"fail\" and (.test_id | IN(\$omit[]) | not))] | length")
            SKIP=$(echo "$RESULTS" | jq "[$LATEST | .[] | select(.result == \"skip\")] | length")
            ERROR=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
              "[$LATEST | .[] | select(.result == \"error\" and (.test_id | IN(\$omit[]) | not))] | length")
            OMIT=$(echo "$RESULTS" | jq "[$LATEST | .[] | select(.result == \"omit\")] | length")
            OMITTED_COUNT=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
              "[$LATEST | .[] | select(.test_id | IN(\$omit[]))] | length")

            echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| :white_check_mark: Pass | $PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| :x: Fail | $FAIL |" >> $GITHUB_STEP_SUMMARY
            echo "| :warning: Error | $ERROR |" >> $GITHUB_STEP_SUMMARY
            echo "| :fast_forward: Skip | $SKIP |" >> $GITHUB_STEP_SUMMARY
            echo "| :arrow_right: Omit | $OMIT |" >> $GITHUB_STEP_SUMMARY
            echo "| :heavy_minus_sign: Omitted (known) | $OMITTED_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # List omitted tests (latest result per test_id)
            if [ "$OMITTED_COUNT" -gt 0 ]; then
              echo "### Omitted Tests (known expected failures)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "$RESULTS" | jq -r --argjson omit "$OMITTED_TESTS" \
                "$LATEST | .[] | select(.test_id | IN(\$omit[])) | \"- **\(.test_id)**: \(.result) - \(.result_message // \"No message\" | .[0:200])\"" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # List failed tests (latest result per test_id, excluding omitted)
            if [ "$FAIL" -gt 0 ] || [ "$ERROR" -gt 0 ]; then
              echo "### Failed/Error Tests" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "$RESULTS" | jq -r --argjson omit "$OMITTED_TESTS" \
                "$LATEST | .[] | select((.result == \"fail\" or .result == \"error\") and (.test_id | IN(\$omit[]) | not)) | \"- **\(.test_id)**: \(.result) - \(.result_message // \"No message\" | .[0:200])\"" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## Inferno US Core ${{ matrix.version_label }} Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo ":warning: No results file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inferno-test-results-${{ matrix.suite_id }}-${{ matrix.backend }}
          path: inferno-results/
          retention-days: 30

      - name: Upload HFS server log on failure
        if: failure() && env.HFS_LOG != ''
        uses: actions/upload-artifact@v7
        with:
          name: hfs-log-${{ matrix.suite_id }}-${{ matrix.backend }}
          path: ${{ env.HFS_LOG }}
          retention-days: 30
          if-no-files-found: ignore

      # Diagnostics: capture why mongod died (host-OOM vs cgroup-OOM vs crash)
      # without needing shell access to the Docker host. Runs before Cleanup
      # removes the container.
      - name: Diagnose MongoDB failure
        if: failure() && matrix.backend == 'mongodb'
        run: |
          echo "::group::MongoDB container state (OOMKilled / exit code)"
          docker inspect "${MONGO_CONTAINER:-none}" \
            --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}} Error={{.State.Error}} FinishedAt={{.State.FinishedAt}}' 2>&1 || true
          echo "::endgroup::"
          echo "::group::mongod logs (last 60 lines)"
          docker logs "${MONGO_CONTAINER:-none}" --tail 60 2>&1 || true
          echo "::endgroup::"
          echo "::group::Host OOM-killer (kernel ring buffer)"
          docker run --rm --privileged busybox dmesg 2>/dev/null \
            | grep -iE "out of memory|killed process|oom" | tail -25 || true
          echo "(end of OOM grep — empty means no OOM lines found)"
          echo "::endgroup::"
          echo "::group::Docker host memory + containers"
          docker run --rm busybox sh -c \
            'grep -E "MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree" /proc/meminfo' 2>&1 || true
          docker info --format 'MemTotal={{.MemTotal}} Containers={{.Containers}} Running={{.ContainersRunning}}' 2>&1 || true
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}' 2>&1 || true
          echo "::endgroup::"

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping HFS..."
          if [ -f /tmp/hfs.pid ]; then
            kill $(cat /tmp/hfs.pid) 2>/dev/null || true
            rm -f /tmp/hfs.pid
          fi

          echo "Stopping Elasticsearch..."
          docker rm -f "${ES_CONTAINER:-none}" 2>/dev/null || true

          echo "Stopping PostgreSQL..."
          docker rm -f "${PG_CONTAINER:-none}" 2>/dev/null || true

          echo "Stopping MongoDB..."
          docker rm -f "${MONGO_CONTAINER:-none}" 2>/dev/null || true

          echo "Cleanup complete"

  inferno-stack-down:
    name: Stop Shared Inferno Stack
    needs: [inferno-stack-up, inferno-test]
    if: always() && needs.inferno-stack-up.result != 'skipped'
    runs-on: [self-hosted, Linux]
    steps:
      - name: Tear down Inferno stack by compose project label
        run: |
          PROJECT="${{ needs.inferno-stack-up.outputs.project }}"
          if [ -z "$PROJECT" ]; then
            PROJECT="inferno-${{ github.run_id }}-${{ github.run_attempt }}"
          fi
          echo "Tearing down compose project: $PROJECT"

          IDS=$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT")
          if [ -n "$IDS" ]; then
            docker rm -f $IDS
          fi

          NETS=$(docker network ls --filter "label=com.docker.compose.project=$PROJECT" -q)
          if [ -n "$NETS" ]; then
            docker network rm $NETS || true
          fi

          VOLS=$(docker volume ls --filter "label=com.docker.compose.project=$PROJECT" -q)
          if [ -n "$VOLS" ]; then
            docker volume rm $VOLS || true
          fi

          echo "Inferno stack teardown complete"
