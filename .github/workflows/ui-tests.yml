name: UI Tests

# Browser-level conformance for crates/ui (helios-ui), per issue #249:
# WCAG 2.2 AA via axe-core, theme behavior, progressive enhancement, and the
# no-CDN invariants — the class of behavior tower::oneshot tests cannot reach.
#
# Two jobs: `build` compiles the server on the host (which already carries the
# Rust toolchain, LLD, and the openssl/sqlite build deps), and `browser` runs
# the Playwright suite inside the official Playwright container (which ships the
# browsers and their system libraries). The container is why the browser job
# doesn't need `playwright install --with-deps` — the self-hosted runner has no
# passwordless sudo to install those libraries itself.

on:
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "crates/ui/**"
      - "locales/**"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: helios-ui unit tests + server build
    # Linux only: the pool also has Windows runners where dtolnay/rust-toolchain
    # fails (it runs through bash/WSL), and the browser job's container is Linux.
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust to use LLD
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld"]' >> ~/.cargo/config.toml

      # The fast inner ring: routing / i18n / headers over tower::oneshot.
      - name: cargo test -p helios-ui
        run: cargo test -p helios-ui

      - name: Build hfs (ui feature)
        run: cargo build -p helios-hfs --features ui

      - name: Upload hfs binary
        uses: actions/upload-artifact@v4
        with:
          name: hfs-ui-bin
          path: target/debug/hfs
          retention-days: 1

  browser:
    name: helios-ui browser suite
    needs: build
    runs-on: [self-hosted, Linux]
    # The Playwright container carries the pinned browsers and every system
    # library they need; keep the tag in step with @playwright/test in
    # crates/ui/e2e/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Download hfs binary
        uses: actions/download-artifact@v4
        with:
          name: hfs-ui-bin
          path: target/debug

      - name: Make hfs executable
        run: chmod +x target/debug/hfs

      - name: Install e2e dependencies
        working-directory: crates/ui/e2e
        run: npm ci

      - name: Run browser suite
        working-directory: crates/ui/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: crates/ui/e2e/playwright-report/
          retention-days: 7
