name: UI Tests

# Browser-level conformance for crates/ui (helios-ui), per issue #249:
# WCAG 2.2 AA via axe-core, theme behavior, progressive enhancement, and the
# no-CDN invariants — the class of behavior tower::oneshot tests cannot reach.
#
# The server is built on the host (it already carries the Rust toolchain, LLD,
# and the openssl/sqlite build deps). The Playwright suite runs inside the
# official Playwright container via `docker run` — the same in-a-step Docker
# pattern the Inferno/HTS jobs use, because this self-hosted runner does not
# support job-level `container:`. The container ships the browsers and their
# system libraries, so no `playwright install --with-deps` (and no sudo) is
# needed.

on:
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "crates/ui/**"
      - "locales/**"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  # Keep in step with @playwright/test in crates/ui/e2e/package.json.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.49.1-noble

jobs:
  ui-tests:
    name: helios-ui browser suite
    # Linux only: the pool also has Windows runners where dtolnay/rust-toolchain
    # fails (it runs through bash/WSL), and the Playwright image is Linux.
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust to use LLD
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld"]' >> ~/.cargo/config.toml

      # The fast inner ring: routing / i18n / headers over tower::oneshot.
      - name: cargo test -p helios-ui
        run: cargo test -p helios-ui

      - name: Build hfs (ui feature)
        run: cargo build -p helios-hfs --features ui

      # The browser ring, inside the Playwright container. boot.mjs starts the
      # host-built hfs (mounted at /work/target/debug/hfs) and Playwright drives
      # it — both live in the container, so they share its localhost.
      - name: Run browser suite (Playwright container)
        run: |
          docker run --rm \
            -e CI=1 \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work/crates/ui/e2e \
            "$PLAYWRIGHT_IMAGE" \
            bash -c "npm ci && npx playwright test"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: crates/ui/e2e/playwright-report/
          retention-days: 7
