name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Check permissions
        if: >
          github.event.comment.author_association != 'OWNER' &&
          github.event.comment.author_association != 'MEMBER' &&
          github.event.comment.author_association != 'COLLABORATOR'
        run: |
          echo "Unauthorized user, skipping"
          exit 0

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Import GPG key and configure signing
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          git config --global user.signingkey ${{ secrets.GPG_KEY_ID }}
          git config --global commit.gpgsign true
          git config --global user.email "claude-bot@heliossoftware.com"
          git config --global user.name "Claude Bot"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'

      # claude-code-action points `origin` at a URL carrying this job's token
      # and leaves it there. This job runs in the runner's shared checkout, so
      # the next job's actions/checkout sees a remote URL that isn't
      # github.com/<repo>, deletes the whole working tree and clones it again.
      # Every file then has a new mtime, and cargo rebuilds every workspace
      # crate in that job (~9 extra minutes of test-rust, 2026-11-04). Put the
      # URL back, which also keeps the token out of .git/config.
      - name: Restore the checkout's remote URL
        if: always()
        # Guarded: an earlier step can fail before there is a checkout.
        run: |
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git remote set-url origin "${{ github.server_url }}/${{ github.repository }}"
          fi
