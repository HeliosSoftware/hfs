name: Inferno US Quality Core Test Suite

on:
  workflow_dispatch: # Manual trigger
  schedule:
    # Weekly US Quality Core conformance tracking run — Saturday 08:00 UTC.
    # Kept off Sunday 08:00 (inferno-us-core, ~2.5h) and clear of the daily
    # suites (hts-ig 03:00, validator 04:00, hts 05:00, ui 06:00) so it does
    # not compete for the self-hosted runners. A tracking indicator, not a
    # gate: the IG is a ballot and the test kit is pre-1.0.
    - cron: "0 8 * * 6"

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  HFS_PORT: 8089
  # Pinned release of inferno-framework/us-quality-core-test-kit. Provides
  # both the Inferno stack and the fixture bundles loaded into HFS, so the
  # suite and its data always move together.
  TEST_KIT_REF: v0.2.0
  # Remote Docker host (set via GitHub repository secrets or variables; leave unset for local Docker)
  DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
  DOCKER_HOST_IP: ${{ secrets.DOCKER_HOST_IP }}

jobs:
  build:
    name: Build HFS
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust to use LLD
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml

      # Only sqlite for now; add the other backend features here when they
      # join the matrix below.
      - name: Build HFS
        run: cargo build -p helios-hfs --features R4,sqlite

      - name: Upload HFS binary
        uses: actions/upload-artifact@v7
        with:
          name: hfs-binary
          path: target/debug/hfs
          retention-days: 1

  inferno-stack-up:
    name: Start Shared Inferno Stack
    runs-on: [self-hosted, Linux]
    outputs:
      port: ${{ steps.up.outputs.port }}
      project: ${{ steps.up.outputs.project }}
    steps:
      - name: Checkout us-quality-core-test-kit
        uses: actions/checkout@v5
        with:
          repository: inferno-framework/us-quality-core-test-kit
          ref: ${{ env.TEST_KIT_REF }}
          path: us-quality-core-test-kit

      # Written before setup.sh (unlike inferno-us-core) so that its
      # `docker compose pull` skips the services disabled here.
      - name: Write CI compose override
        working-directory: us-quality-core-test-kit
        run: |
          # The upstream compose file bind-mounts ./config/nginx.conf from the
          # runner's filesystem. With a remote DOCKER_HOST that path doesn't
          # exist on the daemon — Docker auto-creates the missing source as a
          # directory, which then can't be mounted onto a file. Bake the
          # config into a one-off CI image instead, and assign an ephemeral
          # nginx host port so the stack can coexist on a shared Docker host.
          # (The ./data bind-mounts are fine to leave: inferno, worker and the
          # validator all resolve them on the daemon's filesystem, so they
          # still share the SQLite db and the IG packages inferno copies into
          # data/igs at boot, whether or not that is the runner's checkout.)
          #
          # redis is the exception. Its AOF dir is bind-mounted to ./data/redis,
          # and the redis entrypoint declines to fix ownership when it finds a
          # file it doesn't know (the checked-in .keep), then dies with
          # "Can't open or create append-only dir" — taking inferno and the
          # worker with it. Queue persistence is worthless here, so drop the
          # mount.
          #
          # This kit also bundles an Inferno Reference Server + Postgres for
          # its *client* suite. The server suite never touches them, and they
          # bind fixed host ports (8080) and want ~3GB, so they are parked
          # behind a profile that is never activated. fhirpath and redis stay
          # but lose their fixed host ports (6789/6379), which would collide
          # with a concurrent inferno-us-core stack on the same Docker host.
          #
          # Upstream's nginx does not wait for inferno, and nginx refuses to
          # start when its proxy_pass host does not resolve yet.
          mkdir -p ci-images/nginx
          cat > ci-images/nginx/Dockerfile <<'EOF'
          FROM nginx
          COPY config/nginx.conf /etc/nginx/nginx.conf
          EOF
          cat > docker-compose.override.yml <<'EOF'
          services:
            nginx:
              image: !reset null
              build:
                context: .
                dockerfile: ci-images/nginx/Dockerfile
              volumes: !override []
              ports: !override
                - "0:80"
              depends_on:
                - inferno
            redis:
              ports: !override []
              volumes: !override []
            fhirpath:
              ports: !override []
            inferno_reference_server:
              profiles: ["client-suite"]
            db:
              profiles: ["client-suite"]
          EOF

      - name: Run setup.sh under shared compose project
        working-directory: us-quality-core-test-kit
        env:
          COMPOSE_PROJECT_NAME: inferno-qc-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./setup.sh

      - name: Bring up shared Inferno stack
        id: up
        working-directory: us-quality-core-test-kit
        run: |
          PROJECT="inferno-qc-${{ github.run_id }}-${{ github.run_attempt }}"

          docker compose -p "$PROJECT" up -d

          INFERNO_PORT=$(docker compose -p "$PROJECT" port nginx 80 | head -1 | sed 's/.*://')
          if [ -z "$INFERNO_PORT" ]; then
            echo "Failed to discover Inferno host port"
            docker compose -p "$PROJECT" ps
            docker compose -p "$PROJECT" logs --tail 200
            exit 1
          fi

          INFERNO_HOST="${DOCKER_HOST_IP:-localhost}"
          echo "Waiting for Inferno test kit to respond on $INFERNO_HOST:$INFERNO_PORT..."
          for i in {1..60}; do
            if curl -sf "http://$INFERNO_HOST:$INFERNO_PORT/api/test_suites" > /dev/null 2>&1; then
              echo "Inferno is ready"
              echo "port=$INFERNO_PORT" >> $GITHUB_OUTPUT
              echo "project=$PROJECT" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i/60: Inferno not ready yet..."
            sleep 2
          done
          echo "Inferno is not reachable at http://$INFERNO_HOST:$INFERNO_PORT"
          docker compose -p "$PROJECT" ps
          docker compose -p "$PROJECT" logs --tail 200
          exit 1

  inferno-test:
    name: Inferno US Quality Core ${{ matrix.version_label }} Tests (${{ matrix.backend }})
    needs: [build, inferno-stack-up]
    runs-on: [self-hosted, Linux]
    env:
      INFERNO_PORT: ${{ needs.inferno-stack-up.outputs.port }}
    strategy:
      fail-fast: false
      # Serialized: all matrix jobs share one Inferno instance, which runs a
      # single test run at a time (see inferno-us-core.yml).
      max-parallel: 1
      matrix:
        # The kit also ships us_quality_core_v050 (IG v0.5.0); only the
        # v1.0.0 ballot is tracked here.
        suite_id: [us_quality_core_v100_ballot]
        # sqlite only for now. Adding a backend means porting its service
        # container + HFS start branch from inferno-us-core.yml and enabling
        # its cargo feature in the build job.
        backend: [sqlite]
        include:
          - { suite_id: us_quality_core_v100_ballot, version_label: "v1.0.0-ballot" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout us-quality-core-test-kit (fixtures)
        uses: actions/checkout@v5
        with:
          repository: inferno-framework/us-quality-core-test-kit
          ref: ${{ env.TEST_KIT_REF }}
          path: us-quality-core-test-kit

      - name: Download HFS binary
        uses: actions/download-artifact@v8
        with:
          name: hfs-binary
          path: target/debug

      - name: Make HFS binary executable
        run: chmod +x target/debug/hfs

      - name: Determine runner IP
        run: |
          # Get the runner's IP so the persistent Inferno container can reach HFS on this runner.
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "Runner IP: $RUNNER_IP"

      - name: Set version-specific variables
        run: |
          SUITE=${{ matrix.suite_id }}
          echo "TEST_GROUP_ID=${SUITE}-${SUITE}_fhir_api" >> $GITHUB_ENV

          # Known expected failures, as full Inferno test ids:
          #   "${SUITE}-${SUITE}_fhir_api-${SUITE}_<group>-${SUITE}_<test>"
          #
          # An entry here must suppress a *real* failure in the suite it is
          # emitted for (#492); the "Report omissions that suppressed nothing"
          # step below keeps the list honest. Baseline against the kit's own
          # fixtures on sqlite: 578 pass / 1 skip / 1 fail, the fail being:

          # simple_observation multiple-or status search: a test-kit/fixture
          # gap, not an HFS one. The test searches category=sdoh (its first
          # fixed category value) with every status OR'd, but takes the
          # statuses it expects back (final, cancelled) from the patient's
          # simple observations of *any* category. The kit's example bundle
          # has no sdoh-category Observation at all, so the correct answer is
          # an empty Bundle and the test fails against any conformant server.
          OMITTED="\"${SUITE}-${SUITE}_fhir_api-${SUITE}_simple_observation-${SUITE}_simple_observation_patient_category_status_search_test\""

          echo "OMITTED_TESTS=[${OMITTED}]" >> $GITHUB_ENV

      - name: Start HFS server
        run: |
          HFS_LOG="/tmp/hfs-${{ matrix.suite_id }}-${{ matrix.backend }}.log"
          HFS_BASE_URL="http://$RUNNER_IP:$HFS_PORT"
          echo "HFS_LOG=$HFS_LOG" >> $GITHUB_ENV
          echo "HFS_BASE_URL=$HFS_BASE_URL" >> $GITHUB_ENV

          HFS_BASE_URL="$HFS_BASE_URL" \
          ./target/debug/hfs --database-url :memory: --log-level info --port $HFS_PORT --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          echo $! > /tmp/hfs-qc.pid
          echo "HFS_PID=$(cat /tmp/hfs-qc.pid)" >> $GITHUB_ENV

      - name: Wait for HFS to be ready
        run: |
          echo "Waiting for HFS to start..."
          for i in {1..30}; do
            # Check if the HFS process is still alive
            if ! kill -0 $HFS_PID 2>/dev/null; then
              echo "HFS process ($HFS_PID) has exited!"
              echo "=== HFS log output ==="
              cat "$HFS_LOG"
              echo "=== end of log ==="
              exit 1
            fi
            if curl -sf http://localhost:$HFS_PORT/health > /dev/null 2>&1; then
              echo "HFS is ready"
              exit 0
            fi
            echo "Attempt $i/30: HFS not ready yet..."
            sleep 2
          done
          echo "HFS failed to start (process still running but not responding)"
          echo "=== Last 50 lines of HFS log ==="
          tail -50 "$HFS_LOG"
          echo "=== end of log ==="
          exit 1

      - name: Load US Quality Core test data into HFS
        run: |
          # The kit's own example data (the bundles its reference server is
          # seeded with), loaded through the shared Inferno fixture loader.
          # The loader takes files in glob order, so stage them with numeric
          # prefixes: the custom SearchParameters (recorded-date,
          # do-not-perform, topic) must exist before the resources they index
          # are written.
          FIXTURES="$RUNNER_TEMP/us-quality-core-fixtures"
          rm -rf "$FIXTURES" && mkdir -p "$FIXTURES"
          SRC=us-quality-core-test-kit/client-example-resources
          cp "$SRC/us_quality_core_bundle_search_parameters.json" "$FIXTURES/01_search_parameters.json"
          cp "$SRC/us_quality_core_bundle_patient.json" "$FIXTURES/02_patient.json"

          INFERNO_DATA_DIR="$FIXTURES" ./crates/hfs/tests/inferno/install.sh || {
            echo "=== HFS log output ==="
            cat "$HFS_LOG"
            echo "=== end of log ==="
            exit 1
          }

      - name: Sanity-check shared Inferno stack
        run: |
          INFERNO_HOST="${DOCKER_HOST_IP:-localhost}"
          echo "INFERNO_HOST=$INFERNO_HOST" >> $GITHUB_ENV
          if ! curl -sf "http://$INFERNO_HOST:$INFERNO_PORT/api/test_suites" > /dev/null; then
            echo "Shared Inferno stack not reachable at http://$INFERNO_HOST:$INFERNO_PORT"
            exit 1
          fi

      - name: Create results directory
        run: mkdir -p inferno-results

      - name: Run Inferno tests
        run: |
          # Create a test session for US Quality Core ${{ matrix.version_label }}
          # Retry to handle Inferno's SQLite "database is locked" errors under concurrent load
          echo "Creating test session for ${{ matrix.suite_id }}..."
          for attempt in $(seq 1 5); do
            SESSION_RESPONSE=$(curl -s -X POST "http://$INFERNO_HOST:$INFERNO_PORT/api/test_sessions?test_suite_id=${{ matrix.suite_id }}")
            SESSION_ID=$(echo "$SESSION_RESPONSE" | jq -r '.id' 2>/dev/null) || true

            if [ -n "$SESSION_ID" ] && [ "$SESSION_ID" != "null" ]; then
              break
            fi
            echo "Attempt $attempt/5: Failed to create test session: $SESSION_RESPONSE"
            sleep $((attempt * 3))
          done

          if [ -z "$SESSION_ID" ] || [ "$SESSION_ID" = "null" ]; then
            echo "Failed to create test session after 5 attempts"
            echo "$SESSION_RESPONSE"
            exit 1
          fi

          echo "Test session created: $SESSION_ID"
          echo "$SESSION_RESPONSE" > inferno-results/session.json

          # Start the test run
          # Note: RUNNER_IP is used so the Inferno container can reach HFS on the runner
          # Note: smart_auth_info with auth_type=public allows testing without SMART OAuth
          # Note: patient_ids / care_plan_category_code match the kit's own
          #       inferno_reference_server_100_ballot preset, i.e. the fixture data loaded above
          echo "Starting test run..."
          for attempt in $(seq 1 5); do
            RUN_RESPONSE=$(curl -s -X POST "http://$INFERNO_HOST:$INFERNO_PORT/api/test_runs" \
              -H "Content-Type: application/json" \
              -d "{
                \"test_session_id\": \"$SESSION_ID\",
                \"test_group_id\": \"$TEST_GROUP_ID\",
                \"inputs\": [
                  {\"name\": \"url\", \"value\": \"http://$RUNNER_IP:$HFS_PORT\"},
                  {\"name\": \"patient_ids\", \"value\": \"usqualitycore-patient\"},
                  {\"name\": \"care_plan_category_code\", \"value\": \"assess-plan\"},
                  {\"name\": \"smart_auth_info\", \"value\": \"{\\\"auth_type\\\":\\\"public\\\"}\"}
                ]
              }")

            RUN_ID=$(echo "$RUN_RESPONSE" | jq -r '.id' 2>/dev/null) || true

            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi
            echo "Attempt $attempt/5: Failed to start test run: $RUN_RESPONSE"
            sleep $((attempt * 3))
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Failed to start test run after 5 attempts"
            echo "$RUN_RESPONSE"
            exit 1
          fi

          echo "Test run started: $RUN_ID"
          echo "$RUN_RESPONSE" > inferno-results/run.json

          # Poll for test run completion
          echo "Polling for results..."
          # ~75 profile groups; allow up to an hour.
          MAX_POLLS=360
          POLL_INTERVAL=10
          API_ERRORS=0

          for i in $(seq 1 $MAX_POLLS); do
            # Check test run status directly (more reliable than counting results)
            STATUS_RESPONSE=$(curl -s "http://$INFERNO_HOST:$INFERNO_PORT/api/test_runs/$RUN_ID")
            RUN_STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status' 2>/dev/null) || true

            if [ -z "$RUN_STATUS" ] || [ "$RUN_STATUS" = "null" ]; then
              API_ERRORS=$((API_ERRORS + 1))
              echo "Poll $i/$MAX_POLLS: WARNING - Inferno API returned non-JSON (error $API_ERRORS)"
              echo "  Response (first 200 chars): ${STATUS_RESPONSE:0:200}"
              if [ $API_ERRORS -ge 5 ]; then
                echo "ERROR: Inferno API failed $API_ERRORS consecutive times, aborting"
                echo "=== Last 50 lines of HFS log ==="
                tail -50 "$HFS_LOG"
                echo "=== end of log ==="
                exit 1
              fi
              sleep $POLL_INTERVAL
              continue
            fi
            API_ERRORS=0

            # Get results for progress display (filter to individual tests only, not group aggregations)
            RESULTS=$(curl -s "http://$INFERNO_HOST:$INFERNO_PORT/api/test_runs/$RUN_ID/results")
            TOTAL=$(echo "$RESULTS" | jq '[.[] | select(.test_id)] | length' 2>/dev/null) || TOTAL="?"
            PASS=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "pass")] | length' 2>/dev/null) || PASS="?"
            FAIL=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "fail")] | length' 2>/dev/null) || FAIL="?"
            SKIP=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "skip")] | length' 2>/dev/null) || SKIP="?"
            ERROR=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "error")] | length' 2>/dev/null) || ERROR="?"
            OMIT=$(echo "$RESULTS" | jq '[.[] | select(.test_id and .result == "omit")] | length' 2>/dev/null) || OMIT="?"

            echo "Poll $i/$MAX_POLLS: Status=$RUN_STATUS Total=$TOTAL Pass=$PASS Fail=$FAIL Skip=$SKIP Error=$ERROR Omit=$OMIT"

            # Check if test run is complete
            if [ "$RUN_STATUS" = "done" ]; then
              echo "Test run complete!"
              echo "$RESULTS" > inferno-results/results.json
              break
            fi

            if [ $i -eq $MAX_POLLS ]; then
              # Keep the partial results for the summary/artifact, but fail: a
              # truncated run must not read as "no failures".
              echo "::error::Test run timed out after $((MAX_POLLS * POLL_INTERVAL))s"
              echo "$RESULTS" > inferno-results/results.json
              exit 1
            fi

            sleep $POLL_INTERVAL
          done

      - name: Check test results
        run: |
          if [ ! -f inferno-results/results.json ]; then
            echo "No results file found"
            exit 1
          fi

          RESULTS=$(cat inferno-results/results.json)

          # Inferno records the same test_id multiple times when a test is part
          # of multiple test groups. Count failures based on the LATEST result
          # for each test_id so transient flakes that subsequently passed do not
          # fail the build.
          LATEST='[.[] | select(.test_id)] | group_by(.test_id) | map(sort_by(.created_at) | last)'

          FAIL=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
            "[$LATEST | .[] | select((.result == \"fail\" or .result == \"error\") and (.test_id | IN(\$omit[]) | not))] | length")
          OMITTED_COUNT=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
            "[$LATEST | .[] | select(.test_id | IN(\$omit[]))] | length")

          echo "Failures (excluding $OMITTED_COUNT omitted tests): $FAIL"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL test(s) failed (excluding omitted)"
            echo "$RESULTS" | jq -r --argjson omit "$OMITTED_TESTS" \
              "$LATEST | .[] | select((.result == \"fail\" or .result == \"error\") and (.test_id | IN(\$omit[]) | not)) | \"  \(.test_id): \(.result) - \(.result_message // \"No message\" | .[0:200])\""
            exit 1
          fi

          echo "All tests passed (with $OMITTED_COUNT omitted)"

      # An omission that suppresses nothing is worse than no omission: it is a
      # test that would go red on a real regression and be swallowed instead.
      # The list had accreted 20 such entries before #492 pruned them, and the
      # only reason that was discoverable was a manual audit against a nightly's
      # results. Surface both failure shapes every run so the next one is cheap:
      #
      #   stale  - the id ran and did not fail, so the omission changed nothing
      #   absent - the id is not in this suite at all, so it never could
      #
      # Deliberately a warning, not a gate. A stale omission is not a broken
      # build, and failing on it would make a *fixed* test turn CI red — exactly
      # the backwards incentive that grew this list. It also cannot gate safely
      # for another reason: the list is shared across all backend legs, and
      # an id that passes on one backend may still be suppressing a real failure
      # on another. Pruning needs agreement across the matrix, which a per-job
      # gate cannot see. The job summary can.
      - name: Report omissions that suppressed nothing
        if: always()
        run: |
          if [ ! -f inferno-results/results.json ]; then
            echo "No results file; skipping omit-list audit"
            exit 0
          fi
          # Read the file directly rather than via `echo "$RESULTS"`. The results
          # carry `\n` inside `result_message`, and an `echo` that interprets
          # escapes (zsh, or bash's `echo -e`) expands them mid-string and makes
          # the JSON unparseable. Passing the filename sidesteps the question.
          LATEST='[.[] | select(.test_id)] | group_by(.test_id) | map(sort_by(.created_at) | last)'

          STALE=$(jq -r --argjson omit "$OMITTED_TESTS" \
            "$LATEST | .[] | select((.test_id | IN(\$omit[])) and .result != \"fail\" and .result != \"error\") | \"\(.test_id) — \(.result)\"" \
            inferno-results/results.json)
          ABSENT=$(jq -r --argjson omit "$OMITTED_TESTS" \
            "[$LATEST | .[].test_id] as \$present | \$omit[] | select([.] | inside(\$present) | not)" \
            inferno-results/results.json)

          if [ -z "$STALE" ] && [ -z "$ABSENT" ]; then
            echo "Every omitted id suppressed a real failure — nothing to prune."
            {
              echo "### Omit-list audit"
              echo ""
              echo ":white_check_mark: Every omitted id suppressed a real failure."
            } >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          {
            echo "### Omit-list audit — entries that suppressed nothing"
            echo ""
            echo "These ids are in \`OMITTED_TESTS\` but swallowed no failure in this run."
            echo "Confirm across the other backend legs before pruning (see #492)."
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          if [ -n "$STALE" ]; then
            echo "::warning::Omitted tests that did not fail (candidates for pruning):"
            echo "$STALE" | sed 's/^/  /'
            {
              echo "**Stale — ran and did not fail:**"
              echo ""
              echo "$STALE" | sed 's/^/- /'
              echo ""
            } >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$ABSENT" ]; then
            echo "::warning::Omitted ids not present in this suite at all:"
            echo "$ABSENT" | sed 's/^/  /'
            {
              echo "**Absent — no such test in this suite:**"
              echo ""
              echo "$ABSENT" | sed 's/^/- /'
              echo ""
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate test summary
        if: always()
        run: |
          if [ -f inferno-results/results.json ]; then
            echo "## Inferno US Quality Core ${{ matrix.version_label }} Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            RESULTS=$(cat inferno-results/results.json)

            # Count only the LATEST result for each test_id (Inferno re-runs the
            # same test for every group it belongs to). This matches the build
            # gate in the "Check test results" step.
            LATEST='[.[] | select(.test_id)] | group_by(.test_id) | map(sort_by(.created_at) | last)'

            TOTAL=$(echo "$RESULTS" | jq "[$LATEST | .[]] | length")
            PASS=$(echo "$RESULTS" | jq "[$LATEST | .[] | select(.result == \"pass\")] | length")
            FAIL=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
              "[$LATEST | .[] | select(.result == \"fail\" and (.test_id | IN(\$omit[]) | not))] | length")
            SKIP=$(echo "$RESULTS" | jq "[$LATEST | .[] | select(.result == \"skip\")] | length")
            ERROR=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
              "[$LATEST | .[] | select(.result == \"error\" and (.test_id | IN(\$omit[]) | not))] | length")
            OMIT=$(echo "$RESULTS" | jq "[$LATEST | .[] | select(.result == \"omit\")] | length")
            OMITTED_COUNT=$(echo "$RESULTS" | jq --argjson omit "$OMITTED_TESTS" \
              "[$LATEST | .[] | select(.test_id | IN(\$omit[]))] | length")

            echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| :white_check_mark: Pass | $PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| :x: Fail | $FAIL |" >> $GITHUB_STEP_SUMMARY
            echo "| :warning: Error | $ERROR |" >> $GITHUB_STEP_SUMMARY
            echo "| :fast_forward: Skip | $SKIP |" >> $GITHUB_STEP_SUMMARY
            echo "| :arrow_right: Omit | $OMIT |" >> $GITHUB_STEP_SUMMARY
            echo "| :heavy_minus_sign: Omitted (known) | $OMITTED_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # List omitted tests (latest result per test_id)
            if [ "$OMITTED_COUNT" -gt 0 ]; then
              echo "### Omitted Tests (known expected failures)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "$RESULTS" | jq -r --argjson omit "$OMITTED_TESTS" \
                "$LATEST | .[] | select(.test_id | IN(\$omit[])) | \"- **\(.test_id)**: \(.result) - \(.result_message // \"No message\" | .[0:200])\"" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # List failed tests (latest result per test_id, excluding omitted)
            if [ "$FAIL" -gt 0 ] || [ "$ERROR" -gt 0 ]; then
              echo "### Failed/Error Tests" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "$RESULTS" | jq -r --argjson omit "$OMITTED_TESTS" \
                "$LATEST | .[] | select((.result == \"fail\" or .result == \"error\") and (.test_id | IN(\$omit[]) | not)) | \"- **\(.test_id)**: \(.result) - \(.result_message // \"No message\" | .[0:200])\"" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## Inferno US Quality Core ${{ matrix.version_label }} Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo ":warning: No results file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inferno-qc-test-results-${{ matrix.suite_id }}-${{ matrix.backend }}
          path: inferno-results/
          retention-days: 30

      - name: Upload HFS server log on failure
        if: failure() && env.HFS_LOG != ''
        uses: actions/upload-artifact@v7
        with:
          name: hfs-qc-log-${{ matrix.suite_id }}-${{ matrix.backend }}
          path: ${{ env.HFS_LOG }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping HFS..."
          if [ -f /tmp/hfs-qc.pid ]; then
            kill $(cat /tmp/hfs-qc.pid) 2>/dev/null || true
            rm -f /tmp/hfs-qc.pid
          fi
          echo "Cleanup complete"

  inferno-stack-down:
    name: Stop Shared Inferno Stack
    needs: [inferno-stack-up, inferno-test]
    if: always() && needs.inferno-stack-up.result != 'skipped'
    runs-on: [self-hosted, Linux]
    steps:
      - name: Tear down Inferno stack by compose project label
        run: |
          PROJECT="${{ needs.inferno-stack-up.outputs.project }}"
          if [ -z "$PROJECT" ]; then
            PROJECT="inferno-qc-${{ github.run_id }}-${{ github.run_attempt }}"
          fi
          echo "Tearing down compose project: $PROJECT"

          IDS=$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT")
          if [ -n "$IDS" ]; then
            docker rm -fv $IDS
          fi

          NETS=$(docker network ls --filter "label=com.docker.compose.project=$PROJECT" -q)
          if [ -n "$NETS" ]; then
            docker network rm $NETS || true
          fi

          VOLS=$(docker volume ls --filter "label=com.docker.compose.project=$PROJECT" -q)
          if [ -n "$VOLS" ]; then
            docker volume rm $VOLS || true
          fi

          echo "Inferno stack teardown complete"
