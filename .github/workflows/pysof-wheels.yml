name: Build and Publish pysof Wheels

on:
  workflow_run:
    workflows: ['pysof CI']
    branches: [main, epic/pysof]
    types:
      - completed
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI (only works on tags)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  MATURIN_PEP517_ARGS: --profile release

defaults:
  run:
    working-directory: crates/pysof

jobs:
  setup:
    name: Setup Python Environment
    runs-on: [self-hosted, Linux]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv --python 3.11

      - name: Install maturin
        run: uv add maturin

      - name: Generate cache key
        id: cache-key
        run: echo "key=pysof-wheels-env-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    needs: setup
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          # Linux builds
          - os: Linux
            runner: [self-hosted, Linux]
            target: x86_64-unknown-linux-gnu
            platform: linux_x86_64
          - os: Linux
            runner: [self-hosted, Linux]
            target: x86_64-unknown-linux-musl
            platform: linux_x86_64
          # Windows builds (commented out for testing)
          # - os: Windows
          #   runner: [self-hosted, Windows]
          #   target: x86_64-pc-windows-msvc
          #   platform: win_amd64
          # macOS builds (commented out for testing)
          # - os: macOS
          #   runner: [self-hosted, macOS]
          #   target: x86_64-apple-darwin
          #   platform: macosx_10_9_x86_64
          # - os: macOS
          #   runner: [self-hosted, macOS]
          #   target: aarch64-apple-darwin
          #   platform: macosx_11_0_arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv --python 3.11

      - name: Install maturin
        run: uv add maturin

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run maturin build --release --target ${{ matrix.target }} --out dist

      # - name: Build wheel (Windows)
      #   if: runner.os == 'Windows'
      #   shell: cmd
      #   run: |
      #     uv run maturin build --release --target ${{ matrix.target }} --out dist

      - name: Test wheel installation
        run: |
          # Install the built wheel
          uv pip install dist/*.whl --force-reinstall

          # Run basic import test
          uv run python -c "import pysof; print(f'pysof version: {pysof.__version__}')"

          # Run a subset of tests to verify functionality
          uv run python -m pytest tests/test_import.py tests/test_package_metadata.py -v

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: crates/pysof/dist/*.whl
          retention-days: 30

  create-release:
    name: Create Release
    runs-on: [self-hosted, Linux]
    needs: [setup, build-wheels]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release archive
        run: |
          mkdir -p release
          find dist -name "*.whl" -exec cp {} release/ \;
          cd release
          tar -czf ../pysof-wheels.tar.gz *.whl
          cd ..
          ls -la release/

      - name: Upload consolidated wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: pysof-wheels
          path: |
            release/*.whl
            pysof-wheels.tar.gz
          retention-days: 30

  test-wheels:
    name: Test wheels on ${{ matrix.python-version }}
    runs-on: [self-hosted, Linux]
    needs: [setup, build-wheels]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}

    strategy:
      matrix:
        python-version: ['3.11']
        # Add more Python versions as they become supported

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux_x86_64
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install wheel
        run: uv pip install dist/*.whl --force-reinstall

      - name: Run comprehensive tests
        run: |
          # Install test dependencies
          uv add pytest pytest-cov

          # Run all tests
          uv run python -m pytest tests/ -v --tb=short
