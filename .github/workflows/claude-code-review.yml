name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (for manual runs)"
        required: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.inputs.pr_number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # claude-code-action points `origin` at a URL carrying this job's token
      # and leaves it there. This job runs in the runner's shared checkout, so
      # the next job's actions/checkout sees a remote URL that isn't
      # github.com/<repo>, deletes the whole working tree and clones it again.
      # Every file then has a new mtime, and cargo rebuilds every workspace
      # crate in that job (~9 extra minutes of test-rust, 2026-11-04). Put the
      # URL back, which also keeps the token out of .git/config.
      - name: Restore the checkout's remote URL
        if: always()
        # Guarded: an earlier step can fail before there is a checkout.
        run: |
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git remote set-url origin "${{ github.server_url }}/${{ github.repository }}"
          fi
