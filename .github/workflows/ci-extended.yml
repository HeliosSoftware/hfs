name: HFS Extended CI (Beta/Nightly)

on:
  schedule:
    # Run nightly at 2am Eastern (7am UTC) on weekdays
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # Allow manual trigger too
  workflow_call:      # invoked by ci.yml as a release conformance gate

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  DOCKER_HOST: ${{ secrets.DOCKER_HOST }}

jobs:
  test-rust:
    name: Test Rust (${{ matrix.rust }})
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      matrix:
        rust: [beta, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Configure LLD
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml
      - name: Run tests
        run: cargo test --workspace --all-features

  cleanup-test-containers:
    name: Cleanup Test Containers
    runs-on: [self-hosted, Linux]
    needs: [test-rust]
    if: always()
    env:
      MAX_CONTAINER_AGE_MIN: 90
    steps:
      - name: Check out the Docker host GC action
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions

      - name: Remove testcontainers from this run
        run: |
          docker ps -aq --filter "label=github.run_id=${{ github.run_id }}" | xargs -r docker rm -fv || true

      - name: Sweep orphaned testcontainers from dead runs
        run: |
          # See ci.yml for the full rationale: containers live in `static
          # OnceCell`s and are never dropped, so anything a dead run left behind
          # can only be reaped by label + age.
          now=$(date +%s)
          reaped=0
          for id in $(docker ps -q --filter "label=org.testcontainers.managed-by=testcontainers"); do
            started=$(docker inspect -f '{{.State.StartedAt}}' "$id" 2>/dev/null) || continue
            age_min=$(( (now - $(date -d "$started" +%s)) / 60 ))
            if [ "$age_min" -ge "$MAX_CONTAINER_AGE_MIN" ]; then
              echo "Reaping orphan $id (age ${age_min}m)"
              docker rm -fv "$id" || true
              reaped=$((reaped + 1))
            fi
          done
          echo "Swept ${reaped} orphaned testcontainer(s)."

      # See ci.yml — same sweep, so a nightly extended run cannot leave the
      # shared host dirtier than it found it.
      - name: GC the Docker host
        if: always()
        uses: ./.github/actions/docker-host-gc
