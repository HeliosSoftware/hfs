name: HFS Extended CI (Beta/Nightly/MSRV)

# Early warning for the next Rust releases. Deliberately NOT a release gate:
# releases are built with stable, so a beta or nightly failure says nothing
# about the tagged artifacts (v0.2.7 sat blocked on a nightly rustc bug,
# E0391 on rustc f9ceb4a4d 2026-10-31, while stable and beta passed).
# Instead it runs every day and keeps one `ci-toolchain` issue open while it
# is red, closed once it is green again. RELEASING.md checks that issue
# before tagging.
#
#   beta    - full test suite. Beta becomes stable in <= 6 weeks, so a
#             failure here is a real, dated deadline to fix our code (or to
#             report a rustc regression upstream before it ships).
#   nightly - `cargo check` on every target only. What nightly catches is
#             compiler regressions, and those show up at compile time; the
#             ~90-minute database suite adds nothing on top of beta's.
#   msrv    - `cargo check` on every target with the `rust-version` declared
#             in the root Cargo.toml, so that promise stays true. A
#             `cargo update` can silently raise the real minimum: by v0.2.7
#             the AWS SDK crates needed 1.91.1 while we still claimed 1.90.

on:
  schedule:
    # Nightly self-hosted slots (UTC), one heavy suite at a time, all done
    # before ~06:00 when PR CI picks up; odd minutes dodge GitHub's
    # top-of-hour cron delay. Keep this list identical in every workflow:
    #   ui-tests-matrix 00:13 (~2h20) · hts-ig-conformance 02:47 ·
    #   validator-conformance 03:17 · hts 03:33 · keycloak-smoke 03:53 ·
    #   ci-extended 04:13 Mon-Fri, 09:43 Sat-Sun (~1h30) ·
    #   inferno-us-quality-core Sat 04:13 · inferno-us-core Sun 04:13 (~2h).
    # Weekends run after the inferno suites and ci.yml's 06:30 Windows/macOS
    # nightly (~3h) rather than sharing the 04:13 slot with inferno.
    - cron: "13 4 * * 1-5"
    - cron: "43 9 * * 0,6"
  workflow_dispatch:  # Allow manual trigger too

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  DOCKER_HOST: ${{ secrets.DOCKER_HOST }}

jobs:
  test-rust:
    name: Test Rust (${{ matrix.rust }})
    env:
      # Rustup ranks this above a directory override left on a self-hosted
      # runner (see ci.yml), so each leg really runs the toolchain it names.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      matrix:
        rust: [beta, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Configure LLD
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml
      - name: Run tests
        if: matrix.rust == 'beta'
        run: cargo test --workspace --all-features
      - name: Check all targets
        if: matrix.rust == 'nightly'
        run: cargo check --workspace --all-features --all-targets

  msrv:
    name: Check MSRV
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false
      # Read from the manifest so the check can never drift from the claim.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no rust-version in [workspace.package]"
            exit 1
          fi
          echo "MSRV is $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Configure LLD
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml
      # `--locked`: check the dependency versions we actually ship. Cargo
      # itself fails fast here, before compiling anything, when a locked
      # dependency declares a newer rust-version than ours.
      - name: Check all targets
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --locked --workspace --all-features --all-targets

  # One open issue per red streak: opened on the first failure, commented on
  # each further failure, closed by the next green run. A failed scheduled run
  # otherwise only emails whoever last edited the cron line, which is how a
  # red leg could go unnoticed until a release tag tripped over it.
  report:
    name: Report status
    runs-on: [self-hosted, Linux]
    needs: [test-rust, msrv]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open, update or close the ci-toolchain issue
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ needs.test-rust.result }} ${{ needs.msrv.result }}
        with:
          script: |
            const results = process.env.RESULTS.split(' ');
            const result = results.includes('failure') ? 'failure'
              : results.every(r => r === 'success') ? 'success' : 'other';
            if (result === 'other') {
              core.info(`job results are '${results.join(', ')}'; leaving the issue alone.`);
              return;
            }
            const { owner, repo } = context.repo;
            const label = 'ci-toolchain';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd93f0b',
                description: 'Extended CI (beta/nightly/MSRV Rust) is failing',
              });
            }

            const open = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 1,
            });
            const issue = open.data[0];

            if (result === 'success') {
              if (issue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Extended CI is green again: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: context.runId, per_page: 100 },
            );
            const failed = jobs
              .filter(j => (j.name.startsWith('Test Rust (') || j.name === 'Check MSRV')
                && j.conclusion === 'failure')
              .map(j => `- [${j.name}](${j.html_url})`)
              .join('\n') || '- (could not determine the failing leg)';
            const body = [
              `Extended CI failed on \`${context.sha.slice(0, 9)}\`: ${runUrl}`,
              '',
              failed,
              '',
              'Beta failures become stable failures within six weeks: fix our code, or',
              'report the rustc regression upstream. Nightly failures are usually',
              'rustc bugs: check rust-lang/rust and report one if it is not already filed.',
              'An MSRV failure means our code or a dependency update needs a newer rustc',
              'than the rust-version in Cargo.toml: raise rust-version (and the docs that',
              'quote it), or pin the dependency back.',
              'Neither blocks a release (see RELEASING.md); this issue closes itself',
              'on the next green run.',
            ].join('\n');

            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, labels: [label],
                title: 'Extended CI (beta/nightly/MSRV Rust) is failing',
                body,
              });
            }

  cleanup-test-containers:
    name: Cleanup Test Containers
    runs-on: [self-hosted, Linux]
    needs: [test-rust]
    if: always()
    env:
      # Must exceed the longest CI job runtime (the beta leg runs ~90 minutes).
      MAX_CONTAINER_AGE_MIN: 180
    steps:
      - name: Check out the Docker host GC action
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions

      - name: Remove testcontainers from this run
        run: |
          docker ps -aq --filter "label=github.run_id=${{ github.run_id }}" | xargs -r docker rm -fv || true

      - name: Sweep orphaned testcontainers from dead runs
        run: |
          # See ci.yml for the full rationale: containers live in `static
          # OnceCell`s and are never dropped, so anything a dead run left behind
          # can only be reaped by label + age.
          now=$(date +%s)
          reaped=0
          for id in $(docker ps -q --filter "label=org.testcontainers.managed-by=testcontainers"); do
            started=$(docker inspect -f '{{.State.StartedAt}}' "$id" 2>/dev/null) || continue
            age_min=$(( (now - $(date -d "$started" +%s)) / 60 ))
            if [ "$age_min" -ge "$MAX_CONTAINER_AGE_MIN" ]; then
              echo "Reaping orphan $id (age ${age_min}m)"
              docker rm -fv "$id" || true
              reaped=$((reaped + 1))
            fi
          done
          echo "Swept ${reaped} orphaned testcontainer(s)."

      # See ci.yml — same sweep, so a nightly extended run cannot leave the
      # shared host dirtier than it found it.
      - name: GC the Docker host
        if: always()
        uses: ./.github/actions/docker-host-gc
