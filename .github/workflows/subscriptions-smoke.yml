name: HFS Subscriptions External Smoke

# Matrix shape (see .claude/plans/create-a-plan-to-wild-hopcroft.md):
#   15 build configs   — every non-empty subset of {R4, R4B, R5, R6}.
#   120 smoke jobs     — for each build config, every enabled runtime version
#                        except R6 (R6 is ballot), crossed with 5 backends.
# R6 is compiled and tested by subscriptions-channels.yml (integration + unit
# tests) but not exercised at runtime by the external smoke script.
# Each smoke job exercises rest-hook + websocket + email (when MAILPIT_HTTP_URL
# is set) + FHIR Messaging channels.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  HFS_PORT: 18088
  DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
  DOCKER_HOST_IP: ${{ secrets.DOCKER_HOST_IP }}
  HFS_S3_BUCKET: ${{ secrets.HFS_S3_BUCKET }}

jobs:
  matrix-setup:
    name: Generate matrix
    runs-on: [self-hosted, Linux]
    outputs:
      build-matrix: ${{ steps.gen.outputs.build-matrix }}
      smoke-matrix: ${{ steps.gen.outputs.smoke-matrix }}
    steps:
      - id: gen
        run: |
          SUBSETS='[
            {"build_key":"single-R4",   "features":"R4",           "enabled":["R4"]},
            {"build_key":"single-R4B",  "features":"R4B",          "enabled":["R4B"]},
            {"build_key":"single-R5",   "features":"R5",           "enabled":["R5"]},
            {"build_key":"single-R6",   "features":"R6",           "enabled":["R6"]},
            {"build_key":"R4-R4B",      "features":"R4,R4B",       "enabled":["R4","R4B"]},
            {"build_key":"R4-R5",       "features":"R4,R5",        "enabled":["R4","R5"]},
            {"build_key":"R4-R6",       "features":"R4,R6",        "enabled":["R4","R6"]},
            {"build_key":"R4B-R5",      "features":"R4B,R5",       "enabled":["R4B","R5"]},
            {"build_key":"R4B-R6",      "features":"R4B,R6",       "enabled":["R4B","R6"]},
            {"build_key":"R5-R6",       "features":"R5,R6",        "enabled":["R5","R6"]},
            {"build_key":"R4-R4B-R5",   "features":"R4,R4B,R5",    "enabled":["R4","R4B","R5"]},
            {"build_key":"R4-R4B-R6",   "features":"R4,R4B,R6",    "enabled":["R4","R4B","R6"]},
            {"build_key":"R4-R5-R6",    "features":"R4,R5,R6",     "enabled":["R4","R5","R6"]},
            {"build_key":"R4B-R5-R6",   "features":"R4B,R5,R6",    "enabled":["R4B","R5","R6"]},
            {"build_key":"all",         "features":"R4,R4B,R5,R6", "enabled":["R4","R4B","R5","R6"]}
          ]'
          BACKENDS='["sqlite","sqlite-elasticsearch","postgres","mongodb","s3-elasticsearch"]'

          BUILD=$(jq -c '[.[] | {build_key, features}]' <<<"$SUBSETS")
          # Runtime smoke excludes R6 (ballot spec).
          SMOKE=$(jq -c --argjson b "$BACKENDS" \
            '[.[] as $s | ($s.enabled - ["R6"])[] as $v | $b[] as $bk
              | {build_key: $s.build_key, features: $s.features, fhir_version: $v, backend: $bk}]' \
            <<<"$SUBSETS")

          echo "build-matrix=$BUILD"   >> "$GITHUB_OUTPUT"
          echo "smoke-matrix=$SMOKE"   >> "$GITHUB_OUTPUT"

          echo "Build matrix: $(jq 'length' <<<"$BUILD") jobs"
          echo "Smoke matrix: $(jq 'length' <<<"$SMOKE") jobs"

  build:
    name: Build HFS (${{ matrix.build_key }})
    needs: matrix-setup
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.build-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust to use LLD
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml

      - name: Build HFS binary with subscriptions
        run: |
          cargo build -p helios-hfs --no-default-features \
            --features "${{ matrix.features }},subscriptions,sqlite,elasticsearch,postgres,mongodb,s3"

      - name: Upload HFS binary
        uses: actions/upload-artifact@v7
        with:
          name: hfs-subscriptions-binary-${{ matrix.build_key }}
          path: target/debug/hfs
          retention-days: 1

  subscriptions-smoke:
    name: Smoke (${{ matrix.build_key }} / ${{ matrix.fhir_version }} / ${{ matrix.backend }})
    needs: [matrix-setup, build]
    runs-on: [self-hosted, Linux]
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.smoke-matrix) }}
    env:
      RESULTS_DIR: subscriptions-smoke-results/${{ matrix.build_key }}/${{ matrix.fhir_version }}/${{ matrix.backend }}
      # Enable the FHIR Messaging channel and let it post to 127.0.0.1
      # webhook capture (off by default outside CI).
      HFS_SUBSCRIPTION_MESSAGING_ENABLED: "true"
      HFS_SUBSCRIPTION_ALLOW_PRIVATE_ENDPOINTS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download HFS binary
        uses: actions/download-artifact@v8
        with:
          name: hfs-subscriptions-binary-${{ matrix.build_key }}
          path: target/debug

      - name: Make executables available
        run: |
          chmod +x target/debug/hfs
          chmod +x crates/hfs/tests/subscriptions/run_external_subscriptions_smoke.sh

      - name: Determine runner and Docker host IP
        run: |
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          if [ -n "${DOCKER_HOST_IP:-}" ]; then
            EFFECTIVE_DOCKER_HOST_IP="$DOCKER_HOST_IP"
          else
            EFFECTIVE_DOCKER_HOST_IP="$RUNNER_IP"
          fi
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "DOCKER_HOST_IP=$EFFECTIVE_DOCKER_HOST_IP" >> $GITHUB_ENV
          echo "Runner IP: $RUNNER_IP"
          echo "Docker host IP: $EFFECTIVE_DOCKER_HOST_IP"

      - name: Validate backend configuration
        run: |
          if [ "${{ matrix.backend }}" = "s3-elasticsearch" ] && [ -z "$HFS_S3_BUCKET" ]; then
            echo "::error::s3-elasticsearch backend requires HFS_S3_BUCKET to be configured"
            exit 1
          fi

      - name: Start Elasticsearch
        if: matrix.backend == 'sqlite-elasticsearch' || matrix.backend == 's3-elasticsearch'
        run: |
          ES_CONTAINER="es-subscriptions-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_key }}-${{ matrix.fhir_version }}"
          docker rm -f "$ES_CONTAINER" 2>/dev/null || true
          docker run -d --name "$ES_CONTAINER" -p 0:9200 \
            -e "discovery.type=single-node" \
            -e "xpack.security.enabled=false" \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            elasticsearch:8.15.0

          echo "ES_CONTAINER=$ES_CONTAINER" >> $GITHUB_ENV

          echo "Waiting for Elasticsearch to be ready..."
          for i in {1..30}; do
            ES_PORT=$(docker port "$ES_CONTAINER" 9200 2>/dev/null | head -1 | sed 's/.*://')
            if [ -n "$ES_PORT" ]; then
              if curl -sf "http://$DOCKER_HOST_IP:$ES_PORT/_cluster/health" > /dev/null 2>&1; then
                echo "Elasticsearch is ready on port $ES_PORT"
                echo "ES_PORT=$ES_PORT" >> $GITHUB_ENV
                exit 0
              fi
            fi
            echo "Attempt $i/30: Elasticsearch not ready yet..."
            sleep 2
          done

          echo "Elasticsearch failed to start"
          docker logs "$ES_CONTAINER"
          exit 1

      - name: Start PostgreSQL
        if: matrix.backend == 'postgres'
        run: |
          PG_CONTAINER="pg-subscriptions-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_key }}-${{ matrix.fhir_version }}"
          docker rm -f "$PG_CONTAINER" 2>/dev/null || true
          docker run -d --name "$PG_CONTAINER" -p 0:5432 \
            -e POSTGRES_USER=helios \
            -e POSTGRES_PASSWORD=helios \
            -e POSTGRES_DB=helios \
            postgres:16

          echo "PG_CONTAINER=$PG_CONTAINER" >> $GITHUB_ENV

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec "$PG_CONTAINER" pg_isready -U helios > /dev/null 2>&1; then
              PG_PORT=$(docker port "$PG_CONTAINER" 5432 | head -1 | sed 's/.*://')
              if timeout 2 bash -c "cat < /dev/null > /dev/tcp/$DOCKER_HOST_IP/$PG_PORT" 2>/dev/null; then
                echo "PostgreSQL is ready on port $PG_PORT"
                echo "PG_PORT=$PG_PORT" >> $GITHUB_ENV
                exit 0
              fi
            fi
            echo "Attempt $i/30: PostgreSQL not ready yet..."
            sleep 2
          done

          echo "PostgreSQL failed to start"
          docker logs "$PG_CONTAINER"
          exit 1

      - name: Start MongoDB replica set
        if: matrix.backend == 'mongodb'
        run: |
          MONGO_CONTAINER="mongo-subscriptions-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_key }}-${{ matrix.fhir_version }}"
          docker rm -f "$MONGO_CONTAINER" 2>/dev/null || true
          docker run -d --name "$MONGO_CONTAINER" -p 0:27017 mongo:8.0 \
            --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 0.5

          echo "MONGO_CONTAINER=$MONGO_CONTAINER" >> $GITHUB_ENV

          READY=0
          for i in {1..30}; do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' > /dev/null 2>&1; then
              READY=1
              break
            fi
            echo "Attempt $i/30: MongoDB not ready yet..."
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "MongoDB failed to start"
            docker logs "$MONGO_CONTAINER"
            exit 1
          fi

          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }' > /dev/null 2>&1

          echo "Waiting for MongoDB replica set primary..."
          for i in {1..60}; do
            PRIMARY_STATE=$(docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'try { rs.status().myState } catch (e) { 0 }' | tr -d '\r\n ')
            if [ "$PRIMARY_STATE" = "1" ]; then
              MONGO_PORT=$(docker port "$MONGO_CONTAINER" 27017 | head -1 | sed 's/.*://')
              echo "MongoDB replica set is ready on port $MONGO_PORT"
              echo "MONGO_PORT=$MONGO_PORT" >> $GITHUB_ENV
              exit 0
            fi
            echo "Attempt $i/60: MongoDB replica set not primary yet..."
            sleep 2
          done

          echo "MongoDB replica set failed to become primary"
          docker logs "$MONGO_CONTAINER"
          exit 1

      - name: Configure AWS credentials
        if: matrix.backend == 's3-elasticsearch'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install AWS CLI
        if: matrix.backend == 's3-elasticsearch'
        run: |
          if ! command -v aws &>/dev/null; then
            if ! /tmp/aws-bin/aws --version &>/dev/null; then
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -qo /tmp/awscliv2.zip -d /tmp
              /tmp/aws/install --install-dir /tmp/aws-cli --bin-dir /tmp/aws-bin --update
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi
            echo "/tmp/aws-bin" >> $GITHUB_PATH
          fi
          aws --version 2>/dev/null || /tmp/aws-bin/aws --version

      - name: Start mailpit (email channel sink)
        run: |
          MP_CONTAINER="mailpit-subscriptions-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_key }}-${{ matrix.fhir_version }}-${{ matrix.backend }}"
          docker rm -f "$MP_CONTAINER" 2>/dev/null || true
          docker run -d --name "$MP_CONTAINER" -p 0:1025 -p 0:8025 axllent/mailpit:latest
          echo "MP_CONTAINER=$MP_CONTAINER" >> $GITHUB_ENV

          echo "Waiting for mailpit to be ready..."
          READY=0
          for i in {1..30}; do
            MP_SMTP_PORT=$(docker port "$MP_CONTAINER" 1025 2>/dev/null | head -1 | sed 's/.*://')
            MP_HTTP_PORT=$(docker port "$MP_CONTAINER" 8025 2>/dev/null | head -1 | sed 's/.*://')
            if [ -n "$MP_SMTP_PORT" ] && [ -n "$MP_HTTP_PORT" ] \
                 && curl -sf "http://$DOCKER_HOST_IP:$MP_HTTP_PORT/api/v1/info" >/dev/null 2>&1; then
              READY=1
              break
            fi
            echo "Attempt $i/30: mailpit not ready yet..."
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "mailpit failed to start"
            docker logs "$MP_CONTAINER" || true
            exit 1
          fi

          echo "mailpit ready on SMTP $MP_SMTP_PORT, HTTP $MP_HTTP_PORT"
          echo "HFS_SUBSCRIPTION_SMTP_HOST=$DOCKER_HOST_IP" >> $GITHUB_ENV
          echo "HFS_SUBSCRIPTION_SMTP_PORT=$MP_SMTP_PORT" >> $GITHUB_ENV
          echo "HFS_SUBSCRIPTION_SMTP_ENCRYPTION=none" >> $GITHUB_ENV
          echo "HFS_SUBSCRIPTION_SMTP_FROM=hfs@smoke.test" >> $GITHUB_ENV
          echo "MAILPIT_HTTP_URL=http://$DOCKER_HOST_IP:$MP_HTTP_PORT" >> $GITHUB_ENV

      - name: Install websocat
        run: |
          if command -v websocat >/dev/null 2>&1; then
            echo "WEBSOCAT_BIN=$(command -v websocat)" >> $GITHUB_ENV
            exit 0
          fi

          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)
              ASSET="websocat.x86_64-unknown-linux-musl"
              ;;
            aarch64|arm64)
              ASSET="websocat.aarch64-unknown-linux-musl"
              ;;
            *)
              echo "::error::Unsupported architecture for websocat install: $ARCH"
              exit 1
              ;;
          esac

          WEBSOCAT_PATH="/tmp/websocat"
          curl -fsSL "https://github.com/vi/websocat/releases/download/v1.13.0/${ASSET}" -o "$WEBSOCAT_PATH"
          chmod +x "$WEBSOCAT_PATH"
          echo "WEBSOCAT_BIN=$WEBSOCAT_PATH" >> $GITHUB_ENV
          "$WEBSOCAT_PATH" --version

      - name: Start HFS server
        run: |
          case "${{ matrix.backend }}" in
            sqlite) HFS_PORT=18088 ;;
            sqlite-elasticsearch) HFS_PORT=18089 ;;
            postgres) HFS_PORT=18090 ;;
            mongodb) HFS_PORT=18091 ;;
            s3-elasticsearch) HFS_PORT=18092 ;;
            *) HFS_PORT=18088 ;;
          esac
          mkdir -p "$RESULTS_DIR"

          HFS_LOG="$RESULTS_DIR/hfs.log"
          echo "HFS_PORT=$HFS_PORT" >> $GITHUB_ENV
          echo "RESULTS_DIR=$RESULTS_DIR" >> $GITHUB_ENV
          echo "HFS_LOG=$HFS_LOG" >> $GITHUB_ENV

          if [ "${{ matrix.backend }}" = "sqlite-elasticsearch" ]; then
            HFS_SUBSCRIPTIONS_ENABLED=true \
            HFS_BASE_URL="http://localhost:$HFS_PORT" \
            HFS_DEFAULT_FHIR_VERSION="${{ matrix.fhir_version }}" \
            HFS_STORAGE_BACKEND=sqlite-elasticsearch \
            HFS_ELASTICSEARCH_NODES="http://$DOCKER_HOST_IP:$ES_PORT" \
            ./target/debug/hfs --database-url :memory: --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          elif [ "${{ matrix.backend }}" = "postgres" ]; then
            HFS_SUBSCRIPTIONS_ENABLED=true \
            HFS_BASE_URL="http://localhost:$HFS_PORT" \
            HFS_DEFAULT_FHIR_VERSION="${{ matrix.fhir_version }}" \
            HFS_STORAGE_BACKEND=postgres \
            HFS_PG_HOST="$DOCKER_HOST_IP" \
            HFS_PG_PORT="$PG_PORT" \
            HFS_PG_DBNAME=helios \
            HFS_PG_USER=helios \
            HFS_PG_PASSWORD=helios \
            ./target/debug/hfs --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          elif [ "${{ matrix.backend }}" = "mongodb" ]; then
            HFS_SUBSCRIPTIONS_ENABLED=true \
            HFS_BASE_URL="http://localhost:$HFS_PORT" \
            HFS_DEFAULT_FHIR_VERSION="${{ matrix.fhir_version }}" \
            HFS_STORAGE_BACKEND=mongodb \
            HFS_DATABASE_URL="mongodb://$DOCKER_HOST_IP:$MONGO_PORT/?replicaSet=rs0&directConnection=true" \
            HFS_MONGODB_DATABASE="helios_subscriptions_smoke_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.build_key }}_${{ matrix.fhir_version }}" \
            ./target/debug/hfs --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          elif [ "${{ matrix.backend }}" = "s3-elasticsearch" ]; then
            HFS_SUBSCRIPTIONS_ENABLED=true \
            HFS_BASE_URL="http://localhost:$HFS_PORT" \
            HFS_DEFAULT_FHIR_VERSION="${{ matrix.fhir_version }}" \
            HFS_STORAGE_BACKEND=s3-elasticsearch \
            HFS_S3_BUCKET="${{ secrets.HFS_S3_BUCKET }}" \
            HFS_S3_PREFIX="ci/subscriptions-smoke/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.build_key }}/${{ matrix.fhir_version }}/${{ matrix.backend }}/" \
            HFS_S3_VALIDATE_BUCKETS=false \
            HFS_ELASTICSEARCH_NODES="http://$DOCKER_HOST_IP:$ES_PORT" \
            ./target/debug/hfs --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          else
            HFS_SUBSCRIPTIONS_ENABLED=true \
            HFS_BASE_URL="http://localhost:$HFS_PORT" \
            HFS_DEFAULT_FHIR_VERSION="${{ matrix.fhir_version }}" \
            ./target/debug/hfs --database-url :memory: --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          fi

          echo $! > /tmp/hfs-subscriptions-smoke.pid
          echo "HFS_PID=$(cat /tmp/hfs-subscriptions-smoke.pid)" >> $GITHUB_ENV

      - name: Wait for HFS to be ready
        run: |
          echo "Waiting for HFS to start..."
          for i in {1..30}; do
            if ! kill -0 "$HFS_PID" 2>/dev/null; then
              echo "HFS process ($HFS_PID) exited"
              cat "$HFS_LOG"
              exit 1
            fi
            if curl -sf "http://localhost:$HFS_PORT/health" > /dev/null 2>&1; then
              echo "HFS is ready"
              exit 0
            fi
            echo "Attempt $i/30: HFS not ready yet..."
            sleep 2
          done

          echo "HFS failed to start"
          tail -50 "$HFS_LOG"
          exit 1

      - name: Run subscriptions smoke checks
        run: |
          BASE_URL="http://localhost:$HFS_PORT" \
          FHIR_VERSION="${{ matrix.fhir_version }}" \
          RESULTS_DIR="$RESULTS_DIR" \
          WEBSOCAT_BIN="$WEBSOCAT_BIN" \
          SMOKE_RUN_SUFFIX="${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_key }}-${{ matrix.fhir_version }}-${{ matrix.backend }}" \
          ./crates/hfs/tests/subscriptions/run_external_subscriptions_smoke.sh

      - name: Stop HFS gracefully
        if: always()
        run: |
          if [ -f /tmp/hfs-subscriptions-smoke.pid ]; then
            HFS_PID=$(cat /tmp/hfs-subscriptions-smoke.pid)
            kill -INT "$HFS_PID" 2>/dev/null || true
            for _ in {1..50}; do
              if kill -0 "$HFS_PID" 2>/dev/null; then
                sleep 0.2
              else
                break
              fi
            done
            kill -9 "$HFS_PID" 2>/dev/null || true
          fi
          rm -f /tmp/hfs-subscriptions-smoke.pid

      - name: Collect backend container logs
        if: always()
        run: |
          RESULTS_DIR="${RESULTS_DIR:-subscriptions-smoke-results/${{ matrix.build_key }}/${{ matrix.fhir_version }}/${{ matrix.backend }}}"
          mkdir -p "$RESULTS_DIR/backend-logs"
          if [ -n "${ES_CONTAINER:-}" ]; then
            docker logs "$ES_CONTAINER" > "$RESULTS_DIR/backend-logs/elasticsearch.log" 2>&1 || true
          fi
          if [ -n "${PG_CONTAINER:-}" ]; then
            docker logs "$PG_CONTAINER" > "$RESULTS_DIR/backend-logs/postgres.log" 2>&1 || true
          fi
          if [ -n "${MONGO_CONTAINER:-}" ]; then
            docker logs "$MONGO_CONTAINER" > "$RESULTS_DIR/backend-logs/mongodb.log" 2>&1 || true
          fi
          if [ -n "${MP_CONTAINER:-}" ]; then
            docker logs "$MP_CONTAINER" > "$RESULTS_DIR/backend-logs/mailpit.log" 2>&1 || true
          fi

      - name: Append smoke report to summary
        if: always()
        run: |
          RESULTS_DIR="${RESULTS_DIR:-subscriptions-smoke-results/${{ matrix.build_key }}/${{ matrix.fhir_version }}/${{ matrix.backend }}}"
          if [ -f "$RESULTS_DIR/summary.md" ]; then
            cat "$RESULTS_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Subscriptions Smoke (${{ matrix.build_key }} / ${{ matrix.fhir_version }} / ${{ matrix.backend }})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload subscriptions smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subscriptions-smoke-${{ matrix.build_key }}-${{ matrix.fhir_version }}-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: subscriptions-smoke-results/${{ matrix.build_key }}/${{ matrix.fhir_version }}/${{ matrix.backend }}/
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: |
          if [ -n "${ES_CONTAINER:-}" ]; then
            docker rm -f "$ES_CONTAINER" 2>/dev/null || true
          fi
          if [ -n "${PG_CONTAINER:-}" ]; then
            docker rm -f "$PG_CONTAINER" 2>/dev/null || true
          fi
          if [ -n "${MONGO_CONTAINER:-}" ]; then
            docker rm -f "$MONGO_CONTAINER" 2>/dev/null || true
          fi
          if [ -n "${MP_CONTAINER:-}" ]; then
            docker rm -f "$MP_CONTAINER" 2>/dev/null || true
          fi
