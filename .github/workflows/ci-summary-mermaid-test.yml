# Throwaway experiment: publish a prototype benchmark report as the job summary
# (the unchanged CI text plus collapsed Mermaid charts) in two layouts, to check
# colours, sizes, dark mode and Mermaid inside <details>/<td> on the real Actions
# page. Lives only on tmp/ci-summary-mermaid-test; never merge.
name: CI summary mermaid test

on:
  push:
    branches: [tmp/ci-summary-mermaid-test]

permissions:
  contents: read

jobs:
  stacked:
    name: layout-stacked
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upload the full HTML report without zipping
        id: up
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-stacked.html
          path: .github/tmp-summary-test/report.html
          archive: false
          retention-days: 1
      - name: Write the job summary
        env:
          ARTIFACT_URL: ${{ steps.up.outputs.artifact-url }}
        run: |
          {
            cat .github/tmp-summary-test/stacked.md
            echo
            echo "[Full report (HTML)](${ARTIFACT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
          wc -c "$GITHUB_STEP_SUMMARY"

  sidebyside:
    name: layout-side-by-side
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upload the full HTML report without zipping
        id: up
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-sidebyside.html
          path: .github/tmp-summary-test/report.html
          archive: false
          retention-days: 1
      - name: Write the job summary
        env:
          ARTIFACT_URL: ${{ steps.up.outputs.artifact-url }}
        run: |
          {
            cat .github/tmp-summary-test/sidebyside.md
            echo
            echo "[Full report (HTML)](${ARTIFACT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
          wc -c "$GITHUB_STEP_SUMMARY"
