name: UI Tests (backend matrix)

# The heavy ring of the UI test pyramid: the same Playwright + axe-core browser
# suite that ui-tests.yml runs against SQLite, but replayed against every
# supported storage backend — because a rendering, search, or history bug can
# surface on Postgres or Mongo and stay invisible on SQLite. Modeled on the
# Inferno backend matrix (inferno-subscription.yml): hfs is built once with all
# backends, runs on the runner host against containerized stores, and the
# browser (in the Playwright container) drives it over the runner's IP.
#
# Manual + nightly only — it needs the remote Docker host and cloud secrets and
# takes minutes; ui-tests.yml stays the fast per-PR gate.

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC nightly.
    - cron: "0 6 * * *"
  # While the suite is being built out, run the full matrix on every push to the
  # e2e branch so coverage growth is validated across all backends as it lands.
  push:
    branches: [feat/249-ui-e2e]

concurrency:
  group: ui-tests-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
  DOCKER_HOST_IP: ${{ secrets.DOCKER_HOST_IP }}
  HFS_S3_BUCKET: ${{ secrets.HFS_S3_BUCKET }}
  # Keep in step with @playwright/test in crates/ui/e2e/package.json.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.49.1-noble

jobs:
  build:
    name: Build HFS (all backends + ui)
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # GC *before* the matrix rather than after it. This suite pulls the
      # multi-GB Playwright image on top of Elasticsearch, Postgres and Mongo,
      # so it is the workflow most likely to be the one that finally tips the
      # host over its quota — it needs the headroom up front, not afterwards.
      # `build` runs once and gates the whole matrix, which makes it the right
      # place: one sweep, before anything heavy is pulled.
      - name: GC the Docker host
        uses: ./.github/actions/docker-host-gc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust to use LLD
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml

      - name: Build HFS
        run: |
          cargo build -p helios-hfs --no-default-features \
            --features R4,ui,subscriptions,sqlite,elasticsearch,postgres,mongodb,s3

      - name: Upload HFS binary
        uses: actions/upload-artifact@v7
        with:
          name: hfs-ui-matrix-binary
          path: target/debug/hfs
          retention-days: 1

  ui-matrix:
    name: helios-ui browser suite (${{ matrix.backend }})
    needs: build
    runs-on: [self-hosted, Linux]
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        backend: [sqlite, sqlite-elasticsearch, postgres, mongodb, s3-elasticsearch]
        include:
          - { backend: sqlite, hfs_port: 19080 }
          - { backend: sqlite-elasticsearch, hfs_port: 19081 }
          - { backend: postgres, hfs_port: 19082 }
          - { backend: mongodb, hfs_port: 19083 }
          - { backend: s3-elasticsearch, hfs_port: 19084 }
    env:
      HFS_PORT: ${{ matrix.hfs_port }}
      RESULTS_DIR: ui-matrix-results/${{ matrix.backend }}
      PW_CONTAINER: ui-e2e-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download HFS binary
        uses: actions/download-artifact@v8
        with:
          name: hfs-ui-matrix-binary
          path: target/debug

      - name: Make HFS binary executable
        run: chmod +x target/debug/hfs

      - name: Determine runner and Docker host IP
        run: |
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          if [ -n "${DOCKER_HOST_IP:-}" ]; then
            EFFECTIVE_DOCKER_HOST_IP="$DOCKER_HOST_IP"
          else
            EFFECTIVE_DOCKER_HOST_IP="$RUNNER_IP"
          fi
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          echo "DOCKER_HOST_IP=$EFFECTIVE_DOCKER_HOST_IP" >> "$GITHUB_ENV"
          echo "Runner IP: $RUNNER_IP"
          echo "Docker host IP: $EFFECTIVE_DOCKER_HOST_IP"

      - name: Validate backend configuration
        run: |
          if [ "${{ matrix.backend }}" = "s3-elasticsearch" ] && [ -z "$HFS_S3_BUCKET" ]; then
            echo "::error::s3-elasticsearch backend requires HFS_S3_BUCKET to be configured"
            exit 1
          fi

      - name: Start Elasticsearch
        if: matrix.backend == 'sqlite-elasticsearch' || matrix.backend == 's3-elasticsearch'
        run: |
          # Every container this workflow starts carries hfs-ci=true and the
          # run id. Container names here are run-id-scoped, so a leak can never
          # be matched by name from a later run; the labels are the only thing
          # that lets the docker-host-gc orphan sweep collect one. See the
          # 2026-07-30 leak documented in that action.
          ES_CONTAINER="es-ui-matrix-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}"
          docker rm -fv "$ES_CONTAINER" 2>/dev/null || true
          docker run -d --name "$ES_CONTAINER" -p 0:9200 \
            --label hfs-ci=true \
            --label github.run_id=${{ github.run_id }} \
            --label github.workflow=ui-tests-matrix \
            -e "discovery.type=single-node" \
            -e "xpack.security.enabled=false" \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            elasticsearch:8.15.0

          echo "ES_CONTAINER=$ES_CONTAINER" >> "$GITHUB_ENV"

          echo "Waiting for Elasticsearch to be ready..."
          for i in {1..30}; do
            ES_PORT=$(docker port "$ES_CONTAINER" 9200 2>/dev/null | head -1 | sed 's/.*://')
            if [ -n "$ES_PORT" ]; then
              if curl -sf "http://$DOCKER_HOST_IP:$ES_PORT/_cluster/health" > /dev/null 2>&1; then
                echo "Elasticsearch is ready on port $ES_PORT"
                echo "ES_PORT=$ES_PORT" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            echo "Attempt $i/30: Elasticsearch not ready yet..."
            sleep 2
          done

          echo "Elasticsearch failed to start"
          docker logs "$ES_CONTAINER"
          exit 1

      - name: Start PostgreSQL
        if: matrix.backend == 'postgres'
        run: |
          PG_CONTAINER="pg-ui-matrix-${{ github.run_id }}-${{ github.run_attempt }}"
          docker rm -fv "$PG_CONTAINER" 2>/dev/null || true
          docker run -d --name "$PG_CONTAINER" -p 0:5432 \
            --label hfs-ci=true \
            --label github.run_id=${{ github.run_id }} \
            --label github.workflow=ui-tests-matrix \
            -e POSTGRES_USER=helios \
            -e POSTGRES_PASSWORD=helios \
            -e POSTGRES_DB=helios \
            postgres:16

          echo "PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec "$PG_CONTAINER" pg_isready -U helios > /dev/null 2>&1; then
              PG_PORT=$(docker port "$PG_CONTAINER" 5432 | head -1 | sed 's/.*://')
              if timeout 2 bash -c "cat < /dev/null > /dev/tcp/$DOCKER_HOST_IP/$PG_PORT" 2>/dev/null; then
                echo "PostgreSQL is ready on port $PG_PORT"
                echo "PG_PORT=$PG_PORT" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            echo "Attempt $i/30: PostgreSQL not ready yet..."
            sleep 2
          done

          echo "PostgreSQL failed to start"
          docker logs "$PG_CONTAINER"
          exit 1

      - name: Start MongoDB replica set
        if: matrix.backend == 'mongodb'
        run: |
          MONGO_CONTAINER="mongo-ui-matrix-${{ github.run_id }}-${{ github.run_attempt }}"
          docker rm -fv "$MONGO_CONTAINER" 2>/dev/null || true
          docker run -d --name "$MONGO_CONTAINER" -p 0:27017 \
            --label hfs-ci=true \
            --label github.run_id=${{ github.run_id }} \
            --label github.workflow=ui-tests-matrix \
            mongo:7.0 --replSet rs0 --bind_ip_all

          echo "MONGO_CONTAINER=$MONGO_CONTAINER" >> "$GITHUB_ENV"

          READY=0
          for i in {1..30}; do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' > /dev/null 2>&1; then
              READY=1
              break
            fi
            echo "Attempt $i/30: MongoDB not ready yet..."
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "MongoDB failed to start"
            docker logs "$MONGO_CONTAINER"
            exit 1
          fi

          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }' > /dev/null 2>&1

          echo "Waiting for MongoDB replica set primary..."
          for i in {1..60}; do
            PRIMARY_STATE=$(docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'try { rs.status().myState } catch (e) { 0 }' | tr -d '\r\n ')
            if [ "$PRIMARY_STATE" = "1" ]; then
              MONGO_PORT=$(docker port "$MONGO_CONTAINER" 27017 | head -1 | sed 's/.*://')
              echo "MongoDB replica set is ready on port $MONGO_PORT"
              echo "MONGO_PORT=$MONGO_PORT" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Attempt $i/60: MongoDB replica set not primary yet..."
            sleep 2
          done

          echo "MongoDB replica set failed to become primary"
          docker logs "$MONGO_CONTAINER"
          exit 1

      - name: Configure AWS credentials
        if: matrix.backend == 's3-elasticsearch'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install AWS CLI
        if: matrix.backend == 's3-elasticsearch'
        run: |
          if ! command -v aws &>/dev/null; then
            if ! /tmp/aws-bin/aws --version &>/dev/null; then
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -qo /tmp/awscliv2.zip -d /tmp
              /tmp/aws/install --install-dir /tmp/aws-cli --bin-dir /tmp/aws-bin --update
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi
            echo "/tmp/aws-bin" >> "$GITHUB_PATH"
          fi
          aws --version 2>/dev/null || /tmp/aws-bin/aws --version

      - name: Empty S3 prefix
        if: matrix.backend == 's3-elasticsearch'
        run: |
          BUCKET="${{ secrets.HFS_S3_BUCKET }}"
          PREFIX="ci/ui-matrix/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.backend }}/"
          echo "Emptying s3://$BUCKET/$PREFIX"
          aws s3 rm "s3://$BUCKET/$PREFIX" --recursive
          echo "Prefix emptied"

      - name: Start HFS server
        run: |
          mkdir -p "$RESULTS_DIR"
          HFS_LOG="$RESULTS_DIR/hfs.log"
          echo "HFS_LOG=$HFS_LOG" >> "$GITHUB_ENV"

          # Defensive, and logged so a future incident can rule it in or out:
          # if a pool runner ever carries http(s)_proxy with the private
          # ranges excluded via CIDR in no_proxy, curl (the probes) honors the
          # CIDR but reqwest (HFS's ES client) does not — HFS would detour its
          # backend traffic through the proxy and time out while every probe
          # passes. Naming the hosts exactly works for both clients (#449).
          export NO_PROXY="$DOCKER_HOST_IP,$RUNNER_IP,localhost,127.0.0.1${NO_PROXY:+,$NO_PROXY}"
          export no_proxy="$NO_PROXY"
          echo "Proxy env: $(env | grep -i '^https\?_proxy=' | sed 's/=.*/=set/' | tr '\n' ' ')no_proxy=$no_proxy"

          # Shared UI env: serve the vendored SearchParameter specs (production
          # parity) and advertise natural-language search as configured so its
          # pane renders. The key is never exercised by the suite.
          export HFS_DATA_DIR="$GITHUB_WORKSPACE/data"
          export HFS_NL_SEARCH_API_KEY="e2e-placeholder-not-a-real-key"
          export HFS_DEFAULT_FHIR_VERSION=R4
          # The suite creates and immediately searches; on the ES composites
          # the default asynchronous sync races the specs (nightly reds since
          # the SearchParameter CRUD spec landed). Synchronous puts the write
          # in ES before the API responds; the specs' waitSearchable covers
          # the index-refresh window that remains. No effect on the other
          # backends.
          export HFS_COMPOSITE_SYNC_MODE=synchronous

          if [ "${{ matrix.backend }}" = "sqlite-elasticsearch" ]; then
            HFS_STORAGE_BACKEND=sqlite-elasticsearch \
            HFS_ELASTICSEARCH_NODES="http://$DOCKER_HOST_IP:$ES_PORT" \
            ./target/debug/hfs --database-url :memory: --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          elif [ "${{ matrix.backend }}" = "postgres" ]; then
            HFS_STORAGE_BACKEND=postgres \
            HFS_PG_HOST="$DOCKER_HOST_IP" \
            HFS_PG_PORT="$PG_PORT" \
            HFS_PG_DBNAME=helios \
            HFS_PG_USER=helios \
            HFS_PG_PASSWORD=helios \
            ./target/debug/hfs --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          elif [ "${{ matrix.backend }}" = "mongodb" ]; then
            HFS_STORAGE_BACKEND=mongodb \
            HFS_DATABASE_URL="mongodb://$DOCKER_HOST_IP:$MONGO_PORT/?replicaSet=rs0&directConnection=true" \
            HFS_MONGODB_DATABASE="helios_ui_matrix_${{ github.run_id }}_${{ github.run_attempt }}" \
            ./target/debug/hfs --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          elif [ "${{ matrix.backend }}" = "s3-elasticsearch" ]; then
            HFS_STORAGE_BACKEND=s3-elasticsearch \
            HFS_S3_BUCKET="${{ secrets.HFS_S3_BUCKET }}" \
            HFS_S3_PREFIX="ci/ui-matrix/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.backend }}/" \
            HFS_S3_VALIDATE_BUCKETS=false \
            HFS_ELASTICSEARCH_NODES="http://$DOCKER_HOST_IP:$ES_PORT" \
            ./target/debug/hfs --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          else
            HFS_STORAGE_BACKEND=sqlite \
            ./target/debug/hfs --database-url :memory: --log-level info --port "$HFS_PORT" --host 0.0.0.0 > "$HFS_LOG" 2>&1 &
          fi

          echo $! > /tmp/hfs-ui-matrix-${{ matrix.backend }}.pid
          echo "HFS_PID=$(cat /tmp/hfs-ui-matrix-${{ matrix.backend }}.pid)" >> "$GITHUB_ENV"

      - name: Wait for HFS to be ready
        run: |
          echo "Waiting for HFS /ui..."
          # Startup seeds conformance resources for every provisioned tenant
          # before the server listens: ~1.4k sequential writes, which against
          # real S3 (one PUT per resource) runs to several minutes. Wait well
          # past the slowest backend.
          for i in {1..300}; do
            if ! kill -0 "$HFS_PID" 2>/dev/null; then
              echo "HFS process ($HFS_PID) exited"
              cat "$HFS_LOG"
              exit 1
            fi
            if curl -sf "http://localhost:$HFS_PORT/ui" > /dev/null 2>&1; then
              echo "HFS UI is ready"
              exit 0
            fi
            echo "Attempt $i/300: HFS not ready yet..."
            sleep 2
          done

          echo "HFS failed to start"
          tail -50 "$HFS_LOG"
          if [ -n "${ES_CONTAINER:-}" ]; then
            # Evidence for the next #449-shaped failure: did the container die,
            # was it OOM-killed, and is the mapped port still answering? The
            # 2026-07 incident (quota-choked host, ES stalling post-health-check)
            # burned days for lack of exactly this.
            echo "--- ES container state"
            docker inspect -f 'status={{.State.Status}} oomkilled={{.State.OOMKilled}} exitcode={{.State.ExitCode}} started={{.State.StartedAt}}' "$ES_CONTAINER" || true
            echo "--- ES container log tail"
            docker logs --tail 40 "$ES_CONTAINER" 2>&1 || true
            echo "--- ES reachability from the runner right now"
            curl -sv -m 10 "http://$DOCKER_HOST_IP:$ES_PORT/_cluster/health" 2>&1 | tail -8 || true
          fi
          exit 1

      - name: Probe the conformance read path
        run: |
          # Ground truth for the UI's self-fetch: what the FHIR API returns for
          # the conformance types, and (on ES backends) what the index holds.
          # Diagnostic only — never fails the job.
          sleep 15
          echo "--- GET /CompartmentDefinition?_count=10000"
          curl -s "http://localhost:$HFS_PORT/CompartmentDefinition?_count=10000" | head -c 1500; echo
          echo "--- GET /SearchParameter?_count=2"
          curl -s "http://localhost:$HFS_PORT/SearchParameter?_count=2" | head -c 1500; echo
          if [ -n "${ES_PORT:-}" ]; then
            echo "--- ES indices"
            curl -s "http://$DOCKER_HOST_IP:$ES_PORT/_cat/indices?v" | head -20
            echo "--- ES compartmentdefinition count"
            curl -s "http://$DOCKER_HOST_IP:$ES_PORT/hfs_default_compartmentdefinition/_count" | head -c 300; echo
          fi
        continue-on-error: true

      - name: Run browser suite (Playwright)
        run: |
          set -euo pipefail
          BASE="http://$RUNNER_IP:$HFS_PORT"
          echo "Driving browser against $BASE"
          docker rm -fv "$PW_CONTAINER" 2>/dev/null || true
          # 2g shm: Chromium needs more than docker's 64m default.
          docker run -d --name "$PW_CONTAINER" \
            --label hfs-ci=true \
            --label github.run_id=${{ github.run_id }} \
            --label github.workflow=ui-tests-matrix \
            --shm-size=2g -w /work "$PLAYWRIGHT_IMAGE" sleep 3600
          docker cp crates/ui/e2e "$PW_CONTAINER":/work/e2e
          # The ES composites index asynchronously: specs that assert an
          # immediate post-write search relax to a bounded poll under this
          # flag; the strict read-your-write contract stays guarded by the
          # other backends and the per-PR sqlite suite.
          EVENTUAL=0
          case "${{ matrix.backend }}" in *elasticsearch*) EVENTUAL=1;; esac
          docker exec -e CI=1 -e HFS_E2E_BASE_URL="$BASE" \
            -e HFS_E2E_EVENTUAL_SEARCH="$EVENTUAL" -w /work/e2e "$PW_CONTAINER" \
            bash -c "npm ci && npx playwright test"

      - name: Copy Playwright report out
        if: always()
        run: |
          docker cp "$PW_CONTAINER":/work/e2e/playwright-report \
            "$RESULTS_DIR/playwright-report" 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-matrix-results-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui-matrix-results/${{ matrix.backend }}/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          # Non-silent by design. On 2026-07-30 this host was over its disk
          # quota, containerd could not write meta.db, and `docker rm -f`
          # failed with "disk quota exceeded" — but the error went to
          # /dev/null and `|| true` reported success, so a running Playwright
          # container leaked while this step showed green. Warn instead of
          # hiding it; still non-fatal, so a leak cannot mask the real result.
          reap() {
            local name="${1:-}"
            [ -n "$name" ] || return 0
            if ! docker inspect "$name" >/dev/null 2>&1; then
              echo "$name already gone"
              return 0
            fi
            # Verify by inspect rather than trusting the exit code: `docker rm
            # -f` exits 0 for a container that does not exist, and a wedged
            # daemon can report success without the container actually going
            # away. "Did it disappear?" is the only claim worth making.
            if err=$(docker rm -fv "$name" 2>&1) && ! docker inspect "$name" >/dev/null 2>&1; then
              echo "Removed $name"
            else
              if [ -n "$err" ]; then echo "$err"; fi
              echo "::warning::Could not remove $name; it is leaking on the Docker host."
            fi
          }

          echo "Removing Playwright container..."
          reap "$PW_CONTAINER"

          echo "Stopping HFS..."
          if [ -f /tmp/hfs-ui-matrix-${{ matrix.backend }}.pid ]; then
            HFS_PID=$(cat /tmp/hfs-ui-matrix-${{ matrix.backend }}.pid)
            kill -INT "$HFS_PID" 2>/dev/null || true
            for _ in {1..50}; do
              if kill -0 "$HFS_PID" 2>/dev/null; then
                sleep 0.2
              else
                break
              fi
            done
            kill -9 "$HFS_PID" 2>/dev/null || true
            rm -f /tmp/hfs-ui-matrix-${{ matrix.backend }}.pid
          fi

          echo "Stopping backend containers..."
          # `:-` empty, not `:-none`: the old default asked the daemon to
          # remove a container literally named "none" on every leg that did
          # not start one, which reap() would then report as a spurious miss.
          reap "${ES_CONTAINER:-}"
          reap "${PG_CONTAINER:-}"
          reap "${MONGO_CONTAINER:-}"
