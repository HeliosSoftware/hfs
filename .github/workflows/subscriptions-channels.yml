name: Subscriptions Channel Integration

# Matrix shape (see .claude/plans/create-a-plan-to-wild-hopcroft.md):
#   15 unit-test jobs      — one per non-empty subset of {R4, R4B, R5, R6}.
#                            Catches Class 1 (broken single-version builds).
#   32 rest-hook jobs      — one per enabled runtime version per subset.
#   32 websocket jobs      — same shape. Drives HFS_TEST_FHIR_VERSION.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  matrix-setup:
    name: Generate matrix
    runs-on: [self-hosted, Linux]
    outputs:
      build-matrix: ${{ steps.gen.outputs.build-matrix }}
      integration-matrix: ${{ steps.gen.outputs.integration-matrix }}
    steps:
      - id: gen
        run: |
          SUBSETS='[
            {"build_key":"single-R4",   "features":"R4",           "enabled":["R4"]},
            {"build_key":"single-R4B",  "features":"R4B",          "enabled":["R4B"]},
            {"build_key":"single-R5",   "features":"R5",           "enabled":["R5"]},
            {"build_key":"single-R6",   "features":"R6",           "enabled":["R6"]},
            {"build_key":"R4-R4B",      "features":"R4,R4B",       "enabled":["R4","R4B"]},
            {"build_key":"R4-R5",       "features":"R4,R5",        "enabled":["R4","R5"]},
            {"build_key":"R4-R6",       "features":"R4,R6",        "enabled":["R4","R6"]},
            {"build_key":"R4B-R5",      "features":"R4B,R5",       "enabled":["R4B","R5"]},
            {"build_key":"R4B-R6",      "features":"R4B,R6",       "enabled":["R4B","R6"]},
            {"build_key":"R5-R6",       "features":"R5,R6",        "enabled":["R5","R6"]},
            {"build_key":"R4-R4B-R5",   "features":"R4,R4B,R5",    "enabled":["R4","R4B","R5"]},
            {"build_key":"R4-R4B-R6",   "features":"R4,R4B,R6",    "enabled":["R4","R4B","R6"]},
            {"build_key":"R4-R5-R6",    "features":"R4,R5,R6",     "enabled":["R4","R5","R6"]},
            {"build_key":"R4B-R5-R6",   "features":"R4B,R5,R6",    "enabled":["R4B","R5","R6"]},
            {"build_key":"all",         "features":"R4,R4B,R5,R6", "enabled":["R4","R4B","R5","R6"]}
          ]'

          BUILD=$(jq -c '[.[] | {build_key, features}]' <<<"$SUBSETS")
          INTEGRATION=$(jq -c \
            '[.[] as $s | $s.enabled[] as $v
              | {build_key: $s.build_key, features: $s.features, fhir_version: $v}]' \
            <<<"$SUBSETS")

          echo "build-matrix=$BUILD"             >> "$GITHUB_OUTPUT"
          echo "integration-matrix=$INTEGRATION" >> "$GITHUB_OUTPUT"

          echo "Build / unit-test matrix: $(jq 'length' <<<"$BUILD") jobs"
          echo "Integration matrix: $(jq 'length' <<<"$INTEGRATION") jobs"

  unit-tests:
    name: Unit tests (${{ matrix.build_key }})
    needs: matrix-setup
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.build-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust linker (Linux)
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml

      - name: Run unit tests
        # Keep default features (R4 + sqlite + audit) and add the matrix's
        # extra FHIR versions on top. helios-audit is structurally R4-only,
        # so dropping defaults breaks builds; this matrix exercises adding
        # additional versions to the R4 baseline.
        run: |
          cargo test \
            --features "${{ matrix.features }}" \
            -p helios-subscriptions -p helios-rest -p helios-persistence -p helios-fhirpath

  rest-hook-integration:
    name: Rest-Hook (${{ matrix.build_key }} / ${{ matrix.fhir_version }})
    needs: matrix-setup
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.integration-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust linker (Linux)
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml

      - name: Run subscriptions rest-hook integration test
        env:
          HFS_TEST_FHIR_VERSION: ${{ matrix.fhir_version }}
        run: |
          cargo test -p helios-subscriptions \
            --features "${{ matrix.features }}" --test rest_hook_integration

  websocket-integration:
    name: WebSocket (${{ matrix.build_key }} / ${{ matrix.fhir_version }})
    needs: matrix-setup
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.integration-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust linker (Linux)
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml

      - name: Run subscriptions websocket integration test
        env:
          HFS_TEST_FHIR_VERSION: ${{ matrix.fhir_version }}
        run: |
          cargo test -p helios-subscriptions \
            --features "${{ matrix.features }}" --test websocket_integration

  email-integration:
    name: Email (${{ matrix.build_key }} / ${{ matrix.fhir_version }})
    needs: matrix-setup
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.integration-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure Rust linker (Linux)
        run: |
          mkdir -p ~/.cargo
          rm -f ~/.cargo/config.toml
          echo '[target.x86_64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "clang"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-zstack-size=8388608"]' >> ~/.cargo/config.toml

      - name: Pre-pull mailpit Docker image
        run: docker pull axllent/mailpit:latest

      - name: Run subscriptions email integration test
        env:
          HFS_TEST_FHIR_VERSION: ${{ matrix.fhir_version }}
        run: |
          cargo test -p helios-subscriptions \
            --features "${{ matrix.features }}" --test email_integration
