name: Release build trial

# Builds the Windows and Linux ARM64 release artifacts a second way, without
# the self-hosted Windows agent (agent4) and without the Mac (agent5), and
# smoke-tests each on a GitHub-hosted machine of its own platform. It
# publishes nothing. `ci.yml`'s `build` job still makes every artifact a
# release ships.
#
# When these legs have passed on a release tag, `build` can switch to them:
#
#   * Windows: cross-compiled on a self-hosted Linux agent with cargo-xwin
#     against Microsoft's MSVC CRT and Windows SDK, same target
#     (x86_64-pc-windows-msvc) and same 16 MB main-thread stack as the native
#     build. Smoke-tested on GitHub's `windows-latest`.
#   * Linux ARM64: cross-compiled on a self-hosted Linux agent with
#     cargo-zigbuild against glibc 2.28, the floor the Mac's cross-compile
#     gives the binaries and wheels today. Smoke-tested on GitHub's
#     `ubuntu-24.04-arm`. Off the Mac, the macOS build no longer waits
#     behind it, which is what bounds a release's wall-clock today.
#
# macOS stays on agent5. GitHub's hosted Macs were tried here (`macos-latest`,
# `macos-15-intel`) and both hit the job time limit still compiling, in runs
# 41760116963 and 41834525090. A natively built ARM64 leg on GitHub's
# `ubuntu-24.04-arm` passed (run 41834525090) but took 4h55m of its 6 h limit.
#
# Runs on every `v*` tag (called from `ci.yml`), on pull requests that change
# it, and by hand: Actions -> Release build trial -> Run workflow.

on:
  workflow_call:
  workflow_dispatch:
  # A change to the trial itself is tried on its pull request. (A workflow
  # has to be on the default branch before it can be dispatched by hand.)
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-build-trial.yml
      - .github/scripts/release-smoke.sh

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  # The shipped binaries, as `release` in ci.yml packages them.
  RELEASE_BINS: hfs fhirpath-server fhirpath-cli sof-server sof-cli config-advisor hts

jobs:
  windows-cross:
    name: Windows (cross-compiled on Linux)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 300
    # A trial: a failure here must not turn a release tag's run red.
    continue-on-error: true
    env:
      # Its own dir next to the checkout: the Windows target shares nothing
      # with the native Linux builds in `${{ github.workspace }}-target`.
      CARGO_TARGET_DIR: ${{ github.workspace }}-target-xwin
      # 2, like ci.yml's release `build` job (dev builds there use 4). At 4,
      # run 41744976492 exhausted github-agent3
      # (32 GB) while helios-rest, helios-hfs and pysof compiled together,
      # and took the runner itself offline. At 2 the same build peaked at
      # ~17.5 GB locally (one rustc: helios-fhir) and took 39 min.
      CARGO_BUILD_JOBS: 2
      # cargo-xwin downloads the MSVC CRT and Windows SDK from Microsoft and
      # needs their license accepted. Setting this accepts it for this repo's
      # CI: https://go.microsoft.com/fwlink/?LinkId=2086102
      XWIN_ACCEPT_LICENSE: "1"
      # The native Windows build links with a 16 MB main-thread stack (see
      # "Configure Rust to use LLD (Windows)" in ci.yml). cargo-xwin appends
      # its own flags to this variable rather than replacing it.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C link-arg=/STACK:16777216"
      # `--workspace` includes pysof, and PyO3 cannot ask a Windows Python for
      # its version while cross-compiling. The wheels below are built per
      # interpreter regardless.
      PYO3_CROSS_PYTHON_VERSION: "3.12"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # clang 19 or newer: the MSVC C++ headers reject older clang (STL1000),
      # which `mimalloc` (pysof) hits. The agents' distro clang is 18.
      - name: Install LLVM 19
        run: |
          set -euo pipefail
          ver=19.1.7
          sha=4a5ec53951a584ed36f80240f6fbf8fdd46b4cf6c7ee87cc2d5018dc37caf679
          dir="$RUNNER_TOOL_CACHE/llvm-$ver"
          if [ ! -x "$dir/bin/clang-cl" ]; then
            tmp=$(mktemp -d)
            curl -sSfL -o "$tmp/llvm.tar.xz" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/LLVM-$ver-Linux-X64.tar.xz"
            echo "$sha  $tmp/llvm.tar.xz" | sha256sum -c -
            rm -rf "$dir.partial"
            mkdir -p "$dir.partial"
            tar -xJf "$tmp/llvm.tar.xz" --strip-components=1 -C "$dir.partial"
            rm -rf "$dir" "$tmp"
            mv "$dir.partial" "$dir"
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/clang-cl" --version | head -1

      - name: Install cargo-xwin
        run: |
          set -euo pipefail
          want=0.23.1
          if ! cargo xwin --version 2>/dev/null | grep -q " $want$"; then
            cargo install --locked cargo-xwin --version "$want"
          fi
          cargo xwin --version

      - name: Build release binaries
        run: cargo xwin build --workspace --all-features --release --target x86_64-pc-windows-msvc

      - name: Build pysof wheels
        working-directory: crates/pysof
        run: uv run maturin build --release -o "$GITHUB_WORKSPACE/trial/pysof" --target x86_64-pc-windows-msvc -i python3.10 -i python3.11 -i python3.12 -i python3.13 -i python3.14

      - name: Check the binaries match the native build's linking
        run: |
          set -euo pipefail
          out="$CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release"
          mkdir -p trial/bin
          for b in $RELEASE_BINS; do
            stack=$(llvm-objdump -p "$out/$b.exe" | awk '/SizeOfStackReserve/ {print $2}')
            echo "$b.exe: stack reserve 0x$stack"
            if [ "$stack" != "0000000001000000" ]; then
              echo "::error::$b.exe has stack reserve 0x$stack, expected 16 MB (0x1000000) like the native Windows build"
              exit 1
            fi
            cp "$out/$b.exe" trial/bin/
          done
          cp -r data trial/bin/
          ls -l trial/bin trial/pysof

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: trial-windows-bin
          path: trial/bin
          if-no-files-found: error
          retention-days: 7

      - name: Upload pysof wheels
        uses: actions/upload-artifact@v7
        with:
          name: trial-windows-pysof
          path: trial/pysof
          if-no-files-found: error
          retention-days: 7

      - name: Cap target dir size
        if: always()
        uses: ./.github/actions/cargo-target-gc

  linux-arm64:
    name: Linux ARM64 (cross-compiled on Linux, glibc 2.28)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 300
    continue-on-error: true
    env:
      # Its own dir, like the Windows leg: nothing is shared with the native
      # x86_64 builds in `${{ github.workspace }}-target`.
      CARGO_TARGET_DIR: ${{ github.workspace }}-target-zig
      # 2, like ci.yml's release `build` job; see the Windows leg.
      CARGO_BUILD_JOBS: 2
      # `--workspace` includes pysof, and PyO3 cannot run an ARM64 Python
      # here. The wheels below are built per interpreter regardless.
      PYO3_CROSS_PYTHON_VERSION: "3.12"
      # zig, not Docker: ci.yml points DOCKER_HOST at a remote daemon, which
      # cannot bind-mount this checkout. zig links with lld, which GNU ld's
      # R_AARCH64_CALL26 overflow on hfs and pysof (run 41760116963) needs.
      ZIG_VERSION: 0.15.1
      ZIG_SHA256: c61c5da6edeea14ca51ecd5e4520c6f4189ef5250383db33d01848293bfafe05
      # 0.24.1 / 1.16.0 or newer: older cargo-zigbuild (0.20.1, which maturin
      # 1.10.1 bundles) passes rustc's `--fix-cortex-a53-843419` on to zig,
      # which rejects it ("unsupported linker arg"). Checked locally.
      CARGO_ZIGBUILD_VERSION: 0.24.1
      MATURIN_VERSION: 1.16.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Install zig
        run: |
          set -euo pipefail
          dir="$RUNNER_TOOL_CACHE/zig-$ZIG_VERSION"
          if [ ! -x "$dir/zig" ]; then
            tmp=$(mktemp -d)
            curl -sSfL --retry 5 -o "$tmp/zig.tar.xz" \
              "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
            echo "$ZIG_SHA256  $tmp/zig.tar.xz" | sha256sum -c -
            rm -rf "$dir.partial"
            mkdir -p "$dir.partial"
            tar -xJf "$tmp/zig.tar.xz" --strip-components=1 -C "$dir.partial"
            rm -rf "$dir" "$tmp"
            mv "$dir.partial" "$dir"
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/zig" version

      - name: Install cargo-zigbuild
        run: |
          set -euo pipefail
          if ! cargo install --list | grep -q "^cargo-zigbuild v$CARGO_ZIGBUILD_VERSION:"; then
            cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
          fi
          cargo install --list | grep '^cargo-zigbuild'

      # `.2.28` pins the glibc the binaries are linked against. The vendored
      # OpenSSL comes from crates/hfs and crates/pysof's aarch64-only
      # `vendored` feature, as on the Mac today.
      - name: Build release binaries
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo zigbuild --workspace --all-features --release --target aarch64-unknown-linux-gnu.2.28
          echo "cargo zigbuild: $(( ($(date +%s) - start) / 60 )) min"

      - name: Build pysof wheels
        working-directory: crates/pysof
        run: |
          set -euo pipefail
          start=$(date +%s)
          # `uv tool run`, not `uvx`: the agents have uv but no uvx shim.
          uv tool run --from "maturin==$MATURIN_VERSION" maturin build --release --zig \
            -o "$GITHUB_WORKSPACE/trial/pysof" --target aarch64-unknown-linux-gnu \
            --compatibility manylinux_2_28 \
            -i python3.10 -i python3.11 -i python3.12 -i python3.13 -i python3.14
          echo "maturin: $(( ($(date +%s) - start) / 60 )) min"

      - name: Check the binaries (glibc floor, vendored OpenSSL)
        run: |
          set -euo pipefail
          out="$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release"
          mkdir -p trial/bin
          for b in $RELEASE_BINS; do
            cp "$out/$b" trial/bin/
            file "trial/bin/$b" | grep -q 'ARM aarch64' || { echo "::error::$b is not an ARM64 binary"; exit 1; }
            if objdump -p "trial/bin/$b" | grep -E 'NEEDED +lib(ssl|crypto)\.so'; then
              echo "::error::$b links the system OpenSSL; the ARM64 release vendors it"
              exit 1
            fi
            need=$(objdump -T "trial/bin/$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$b needs $need"
            if [ "$(printf '%s\n' "$need" GLIBC_2.28 | sort -V | tail -1)" != GLIBC_2.28 ]; then
              echo "::error::$b needs $need, newer than the glibc 2.28 the current ARM64 release supports"
              exit 1
            fi
          done
          cp -r data trial/bin/
          ls -l trial/bin trial/pysof

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: trial-linux-arm64-bin
          path: trial/bin
          if-no-files-found: error
          retention-days: 7

      - name: Upload pysof wheels
        uses: actions/upload-artifact@v7
        with:
          name: trial-linux-arm64-pysof
          path: trial/pysof
          if-no-files-found: error
          retention-days: 7

      - name: Cap target dir size
        if: always()
        uses: ./.github/actions/cargo-target-gc

  smoke:
    name: Smoke test ${{ matrix.leg }} on ${{ matrix.runner }}
    needs: [windows-cross, linux-arm64]
    # Each leg is tested if it uploaded, whatever the others did. Not
    # `always()`: that also runs on a cancelled run, where every download
    # fails and the PR shows red smoke tests for a run nobody wanted.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: windows
            runner: windows-latest
          - leg: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: trial-${{ matrix.leg }}-bin
          path: trial/bin

      - name: Download pysof wheels
        uses: actions/download-artifact@v8
        with:
          name: trial-${{ matrix.leg }}-pysof
          path: trial/pysof

      - name: Smoke test
        shell: bash
        run: bash .github/scripts/release-smoke.sh trial/bin trial/pysof
