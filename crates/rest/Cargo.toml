[package]
name = "helios-rest"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/HeliosSoftware/hfs/tree/main/crates/rest"
rust-version.workspace = true
description = "FHIR RESTful API implementation for Helios FHIR Server"
keywords = ["helios-software", "hl7", "fhir", "helios-fhir-server", "rest"]
categories = ["web-programming", "database"]

[features]
default = ["R4", "sqlite"]

# FHIR version features (pass through to helios-fhir, helios-persistence, helios-serde, helios-sof, helios-subscriptions)
R4 = ["helios-fhir/R4", "helios-persistence/R4", "helios-serde?/R4", "helios-sof/R4", "helios-subscriptions?/R4"]
R4B = ["helios-fhir/R4B", "helios-persistence/R4B", "helios-serde?/R4B", "helios-sof/R4B", "helios-subscriptions?/R4B"]
R5 = ["helios-fhir/R5", "helios-persistence/R5", "helios-serde?/R5", "helios-sof/R5", "helios-subscriptions?/R5"]
R6 = ["helios-fhir/R6", "helios-persistence/R6", "helios-serde?/R6", "helios-sof/R6", "helios-subscriptions?/R6"]

# Serialization format features
xml = ["helios-fhir/xml", "dep:helios-serde", "helios-serde?/xml"]

# Database backends (pass through to helios-persistence)
sqlite = ["helios-persistence/sqlite"]
postgres = ["helios-persistence/postgres"]
mongodb = ["helios-persistence/mongodb"]
elasticsearch = ["helios-persistence/elasticsearch"]
s3 = ["helios-persistence/s3", "dep:aws-sdk-s3", "dep:aws-config"]

# Auth feature (pass through to helios-auth)
redis = ["helios-auth/redis"]

# Subscriptions
subscriptions = ["dep:helios-subscriptions"]

[dependencies]
# Core dependencies
helios-fhir = { path = "../fhir", version = "0.1.47", default-features = false }
helios-persistence = { path = "../persistence", version = "0.1.47", default-features = false }
helios-serde = { path = "../serde", version = "0.1.47", optional = true, default-features = false }
helios-sof = { path = "../sof", version = "0.1.47", default-features = false }
helios-auth = { path = "../auth", version = "0.1.47" }
helios-audit = { path = "../audit", version = "0.1.47" }
helios-subscriptions = { path = "../subscriptions", version = "0.1.47", optional = true, default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web framework
axum = { version = "0.8", features = ["json", "query", "matched-path", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "request-id"] }
http = "1.0"
mime = "0.3"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror = "2"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI and configuration
clap = { version = "4.0", features = ["derive", "env"] }

# Date/time
chrono.workspace = true

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
json-patch = "3"
futures = "0.3"
dashmap = "6"

# SQL-query-run: DDL validation
sqlparser = "0.54"

# S3 export sink (optional — only when s3 feature is enabled)
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

# HTTP client for terminology server integration (HTS)
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
# HTTP testing
axum-test = "18.0"

# Temp files
tempfile = "3"

# Async test utilities
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"

# JSON path for test assertions
jsonpath-rust = "0.7"

# Regex for pattern matching in tests
regex = "1"

# Postgres conformance test (gated via #[ignore] + PG_CONFORMANCE env var).
# Brings up a PostgreSQL container locally — same versions used by
# `helios-persistence`'s integration tests for binary-version parity.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[package.metadata.docs.rs]
features = ["R4", "sqlite"]
rustdoc-args = ["--cfg", "docsrs"]
