[package]
name = "helios-rest"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/HeliosSoftware/hfs/tree/main/crates/rest"
rust-version.workspace = true
description = "FHIR RESTful API implementation for Helios FHIR Server"
keywords = ["helios-software", "hl7", "fhir", "helios-fhir-server", "rest"]
categories = ["web-programming", "database"]

[features]
default = ["R4", "sqlite"]

# FHIR version features (pass through to helios-fhir, helios-persistence, helios-audit, helios-serde, helios-sof, helios-subscriptions, helios-fhir-validator)
# This crate's version set must equal the set helios-fhir is unified to:
# helios-fhir-validator (`packs::core_registry`, `core_terminology`) and the
# per-version matches here, in persistence, sof, serde and subscriptions gate
# each arm on their own crate's features, so a version helios-fhir enables
# without them reaches a catch-all arm. For the validator that arm panics (#2064).
# helios-audit's R5/R6 (reached directly and through helios-persistence) enable
# helios-fhir/R4B as the BALP baseline, so R5/R6 enable this crate's own `R4B`,
# as helios-audit does.
R4 = ["helios-fhir/R4", "helios-persistence/R4", "helios-audit/R4", "helios-serde?/R4", "helios-sof/R4", "helios-subscriptions?/R4", "helios-fhir-validator/R4"]
R4B = ["helios-fhir/R4B", "helios-persistence/R4B", "helios-audit/R4B", "helios-serde?/R4B", "helios-sof/R4B", "helios-subscriptions?/R4B", "helios-fhir-validator/R4B"]
R5 = ["helios-fhir/R5", "helios-persistence/R5", "helios-audit/R5", "helios-serde?/R5", "helios-sof/R5", "helios-subscriptions?/R5", "helios-fhir-validator/R5", "R4B"]
R6 = ["helios-fhir/R6", "helios-persistence/R6", "helios-audit/R6", "helios-serde?/R6", "helios-sof/R6", "helios-subscriptions?/R6", "helios-fhir-validator/R6", "R4B"]

# Serialization format features
xml = ["helios-fhir/xml", "dep:helios-serde", "helios-serde?/xml"]

# Database backends (pass through to helios-persistence)
sqlite = ["helios-persistence/sqlite"]
postgres = ["helios-persistence/postgres"]
mongodb = ["helios-persistence/mongodb"]
elasticsearch = ["helios-persistence/elasticsearch"]
s3 = ["helios-persistence/s3", "dep:aws-sdk-s3", "dep:aws-config"]

# Subscriptions
subscriptions = ["dep:helios-subscriptions"]

# Deprecated no-op, kept so existing build invocations keep working.
# Bulk-submit JWE decryption of `fileEncryptionKey` manifests/files is now built
# unconditionally — see the `jwe` module for the supported algorithms.
bulk-submit-jwe = []

# OpenTelemetry OTLP trace export (forwards to helios-observability)
otel = ["helios-observability/otel"]

[dependencies]
# Core dependencies
helios-fhir = { path = "../fhir", version = "0.2.4", default-features = false }
helios-persistence = { path = "../persistence", version = "0.2.4", default-features = false }
helios-serde = { path = "../serde", version = "0.2.4", optional = true, default-features = false }
helios-sof = { path = "../sof", version = "0.2.4", default-features = false }
helios-auth = { path = "../auth", version = "0.2.4" }
# `SearchProvider::search_param_registry` returns a `parking_lot::RwLock`; the
# patient-compartment confinement (#1618) names it, as do the batch unit
# tests' mock storage.
parking_lot = "0.12"
helios-audit = { path = "../audit", version = "0.2.4", default-features = false }
helios-subscriptions = { path = "../subscriptions", version = "0.2.4", optional = true, default-features = false }
helios-fhir-validator = { path = "../fhir-validator", version = "0.2.4", default-features = false, features = ["fhirpath"] }
helios-observability = { path = "../observability", version = "0.2.4" }

# Async runtime
tokio = { version = "1", features = ["full"] }
# `io` provides StreamReader, bridging the reqwest byte stream for bulk-submit
# NDJSON files into the AsyncBufRead the ingestion engine consumes.
tokio-util = { version = "0.7", features = ["io"] }
# Bulk-submit file bodies are fetched without reqwest's transparent gzip so the
# fetcher knows the wire offset a `Range` resume must start from; it decodes
# gzip itself with the same decoder reqwest uses. `bytes` names the body chunks.
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
bytes = "1"
async-trait = "0.1"

# Web framework
axum = { version = "0.8", features = ["json", "query", "matched-path", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "request-id", "compression-full", "decompression-full"] }
http = "1.0"
# Names the length-limit error of `axum::body::to_bytes`, so an over-limit
# batch body maps to 413 instead of a generic 400.
http-body-util = "0.1"
mime = "0.3"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"

# Error handling
thiserror = "2"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI and configuration
clap = { version = "4.0", features = ["derive", "env"] }

# Date/time
chrono.workspace = true

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
futures = "0.3"
dashmap = "6"

# SQL-query-run: DDL validation; `visitor` walks nested statements (#1702)
sqlparser = { version = "0.54", features = ["visitor"] }

# Base64 (used to wrap $sqlquery-run flat output as Binary.data when the caller
# asks for application/fhir+json)
base64 = "0.22"

# S3 export sink (optional — only when s3 feature is enabled)
# Use the modern HTTPS client, as persistence and audit do. Preserve the
# SDK's signing, HTTP 1.x and Tokio features without enabling legacy rustls.
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = { version = "1", optional = true }

# HTTP client for terminology server integration (HTS)
reqwest = { version = "0.12", features = ["json", "gzip"] }

# JWT signing for the bulk-submit outbound SMART Backend Services client.
jsonwebtoken = "9"

# Pure-Rust JOSE primitives for bulk-submit JWE decryption (`fileEncryptionKey`),
# implemented in `src/jwe.rs`. RustCrypto throughout — no OpenSSL.
aes = "0.8"                                              # A*CBC-HS* content encryption
aes-gcm = "0.10"                                         # A*GCM content encryption + A*GCMKW
aes-kw = "0.2"                                           # A*KW key wrap (RFC 3394)
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hmac = "0.12"                                            # A*CBC-HS* authentication tag
sha2 = "0.10"                                            # Concat KDF, A*CBC-HS*
p256 = { version = "0.13", features = ["ecdh", "jwk", "pem", "pkcs8"] }  # ECDH-ES (P-256)
p384 = { version = "0.13", features = ["ecdh", "jwk", "pem", "pkcs8"] }  # ECDH-ES (P-384)
# JWE `zip: "DEF"` payloads — and, via Cargo's feature unification, the
# deflate backend for the `flate2` that `tower-http`'s `CompressionLayer`
# reaches through `async-compression` -> `compression-codecs`. `flate2`
# defaults to `miniz_oxide`; `zlib-rs` is the pure-Rust zlib-ng port and
# compresses the searchset bodies this server returns 1.7-2.9x faster at the
# same output size. No C toolchain is required for either.
flate2 = { version = "1", features = ["zlib-rs"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
# HTTP testing
axum-test = "18.0"

# Inject synthetic request-log traffic in console-metrics tests (the same
# in-process request log the handlers read for per-tenant traffic).
helios-observability = { path = "../observability" }

# Key generation for the JWE round-trip tests
rand = "0.8"


# Direct SQLite fixture access for legacy-row REST tests. Bounded to the version
# already used by helios-persistence; no new backend code is exposed.
rusqlite = { version = "0.33", features = ["bundled", "serde_json", "functions"] }

# Read streamed Parquet / Arrow IPC responses back in tests. Same versions as
# helios-sof, which does the encoding.
arrow = "54.0"
parquet = "54.0"

# Temp files
tempfile = "3"

# Async test utilities
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"
futures = "0.3"

# JSON path for test assertions
jsonpath-rust = "0.7"

# base64url decoding for OAuth assertion inspection in tests
base64 = "0.22"

# Regex for pattern matching in tests
regex = "1"

# Postgres conformance test (gated via #[ignore] + PG_CONFORMANCE env var).
# Brings up a PostgreSQL container locally — same versions used by
# `helios-persistence`'s integration tests for binary-version parity.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mongo", "elastic_search"] }

# `#[ctor::dtor]` exit hook that removes testcontainers held in `static`s
# (tests/common/container_cleanup.rs).
ctor = "0.2"

[package.metadata.docs.rs]
features = ["R4", "sqlite"]
rustdoc-args = ["--cfg", "docsrs"]
