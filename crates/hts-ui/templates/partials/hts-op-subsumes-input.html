{#-
  CS $subsumes input for the standalone workbench (design doc §7.6 F4).
  Slice B fields, editable `system` since the scope is Free.
-#}
<form id="hts-workbench-input"
      class="hts-op-workbench__input"
      method="post"
      action="/ui/hts/operations/subsumes"
      hx-post="/ui/hts/operations/subsumes"
      hx-target="#hts-workbench-result"
      hx-swap="outerHTML"
      aria-labelledby="hts-workbench-input-heading">
  <h2 id="hts-workbench-input-heading" class="hts-op-workbench__input-heading">
    {{ chrome.i18n.t("hts-cs-subsumes-heading") }}
  </h2>

  <fieldset class="hts-op-workbench__scope">
    <legend>{{ chrome.i18n.t("hts-operations-scope-legend") }}</legend>
    <div class="hts-op-workbench__field">
      <label for="sub-system">{{ chrome.i18n.t("hts-operations-scope-system") }}</label>
      <input id="sub-system" name="system" type="url" required autocomplete="off" spellcheck="false">
    </div>
    <div class="hts-op-workbench__field">
      <label for="sub-version">{{ chrome.i18n.t("hts-cs-subsumes-version") }}</label>
      <input id="sub-version" name="version" type="text" autocomplete="off" spellcheck="false">
    </div>
  </fieldset>

  <div class="hts-op-workbench__field">
    <label for="sub-code-a">{{ chrome.i18n.t("hts-cs-subsumes-codeA") }}</label>
    <input id="sub-code-a" name="codeA" type="text" required autocomplete="off" spellcheck="false">
  </div>
  <div class="hts-op-workbench__field">
    <label for="sub-code-b">{{ chrome.i18n.t("hts-cs-subsumes-codeB") }}</label>
    <input id="sub-code-b" name="codeB" type="text" required autocomplete="off" spellcheck="false">
  </div>

  <div class="hts-op-workbench__actions">
    <button type="submit" class="btn btn--primary">{{ chrome.i18n.t("hts-workbench-run") }}</button>
  </div>
</form>
