[package]
name = "helios-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Authentication and authorization for the Helios FHIR Server"

[features]
default = []
# Redis-backed JWKS refresh coordination (cluster design §5 C2).
redis = ["dep:redis"]

[dependencies]
# JWT validation
jsonwebtoken = "9"

# HTTP client for JWKS endpoint
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Redis (optional, for cluster JWKS refresh coordination)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }

# SMART scope permissions
bitflags = "2"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async runtime
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
async-trait = "0.1"

# Time
chrono.workspace = true

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
# For the RUN_REDIS_CLUSTER_TESTS=1-gated Redis coordination T2 twin
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis"] }
