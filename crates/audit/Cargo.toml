[package]
name = "helios-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Audit event logging for HFS — FHIR AuditEvent with IHE BALP profiles"

[features]
default = ["R4"]
R4 = ["helios-fhir/R4"]
R4B = ["helios-fhir/R4B"]
R5 = ["helios-fhir/R5"]
R6 = ["helios-fhir/R6"]

[dependencies]
# FHIR models
helios-fhir = { path = "../fhir" }

# Auth trait (AuditEventSink bridge)
helios-auth = { path = "../auth" }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async runtime
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "macros"] }
async-trait = "0.1"

# Time
chrono.workspace = true

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# HTTP framework (middleware)
axum = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
