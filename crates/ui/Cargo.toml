[package]
name = "helios-ui"
version.workspace = true
edition.workspace = true
description = "Optional server-rendered HTMX web UI for the Helios FHIR Server"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/HeliosSoftware/hfs/tree/main/crates/ui"
keywords = ["helios-software", "fhir", "ui", "htmx"]

[features]
# FHIR version features forward to helios-fhir so the viewer read paths
# (SearchParameter registry snapshot, compartment definitions) cover exactly
# the versions the server is built with. R4 is the workspace default.
default = ["R4"]
R4 = ["helios-fhir/R4"]
R4B = ["helios-fhir/R4B"]
R5 = ["helios-fhir/R5"]
R6 = ["helios-fhir/R6"]

[dependencies]
# Read paths into the rest of the workspace: the SearchParameter spec loader
# and registry types (#238) and the per-version compartment-params table
# (#237). Data flows one way — the UI depends on the workspace, never the
# reverse.
helios-fhir = { path = "../fhir", version = "0.2.1", default-features = false }

# Parses the vendored CompartmentDefinition spec JSONs (data/compartments/)
# at first use, and derives the query-string extractors. Both already in the
# workspace dependency graph via helios-fhir.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Web framework (matches the version used by helios-hfs / helios-rest)
axum = "0.8"

# Compile-time, type-checked, auto-escaping templates (Jinja2-like).
# Markup lives in templates/, never in Rust source.
askama = "0.16"

# Typed htmx header handling: the infallible `HxRequest` extractor for the
# fragment-vs-full-page branch, and `AutoVaryLayer` for correct HTTP caching
# (`Vary: HX-Request`) so an htmx fragment is never served for a hard navigation.
axum-htmx = { version = "0.8", features = ["auto-vary"] }

# Static assets (htmx, CSS) embedded into the binary at compile time so the
# server has no runtime CDN dependency and works in air-gapped deployments.
# `axum-embed` serves them with precompressed (br/gzip/deflate) negotiation.
rust-embed = "8"
axum-embed = "0.1"

# Fluent message catalogs (locales/<locale>/main.ftl at the workspace root),
# embedded at compile time — same no-runtime-dependency stance as the assets.
# See docs/multi-language.md for the i18n rules of the road.
fluent-templates = "0.13"
unic-langid = { version = "0.9", features = ["macros"] }

[dev-dependencies]
# Parses the .ftl sources so tests can enforce key-set parity across locales.
fluent-syntax = "0.11"
# Drive the mounted router end-to-end (locale middleware included) in tests.
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
