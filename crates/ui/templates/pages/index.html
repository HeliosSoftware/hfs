{% extends "layouts/base.html" %}

{% block content %}
<h1>{{ i18n.t("app-title") }}</h1>
<p class="lede">{{ i18n.t("home-lede") }}</p>

<div id="status">
  {% include "partials/status.html" %}
</div>

<!--
  Progressive enhancement: this is a real link. Without JavaScript, clicking it
  performs a hard navigation to /ui/status, which returns a full page. With htmx
  loaded, the request carries the HX-Request header and the handler returns just
  the fragment, swapped into #status.
-->
<a
  class="button"
  href="/ui/status"
  hx-get="/ui/status"
  hx-target="#status"
  hx-swap="innerHTML"
>{{ i18n.t("action-refresh-status") }}</a>
{% endblock %}
