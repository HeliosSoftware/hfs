[package]
name = "helios-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/HeliosSoftware/hfs/tree/main/crates/persistence"
rust-version.workspace = true
description = "Polyglot persistence layer for Helios FHIR Server"
keywords = ["helios-software", "hl7", "fhir", "helios-fhir-server", "persistence"]
categories = ["database", "web-programming"]

# `R4` is included in the default set so a bare `cargo build -p helios-persistence`
# compiles: the crate depends on helios-fhir/helios-fhirpath with
# `default-features = false`, so without a FHIR version feature the FhirVersion
# enum has no variants and version-dispatch matches fail to compile. This mirrors
# the `rest` and `hfs` crates, which also default to `["R4", "sqlite"]`.
[features]
default = ["R4", "sqlite"]

# Database backends
sqlite = ["dep:rusqlite", "dep:r2d2", "dep:r2d2_sqlite"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:postgres-types"]
cassandra = ["dep:cdrs-tokio", "dep:cdrs-tokio-helpers-derive"]
mongodb = ["dep:mongodb"]
neo4j = ["dep:neo4rs"]
elasticsearch = ["dep:elasticsearch"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-credential-types"]

# Configuration advisor binary
advisor = ["dep:axum", "dep:tower-http", "dep:tracing-subscriber"]

# Audit event integration
audit = ["dep:helios-audit"]

# FHIR version features (pass through to helios-fhir, helios-fhirpath, helios-sof)
R4 = ["helios-fhir/R4", "helios-fhirpath/R4", "helios-sof/R4", "helios-audit?/R4"]
R4B = ["helios-fhir/R4B", "helios-fhirpath/R4B", "helios-sof/R4B", "helios-audit?/R4B"]
R5 = ["helios-fhir/R5", "helios-fhirpath/R5", "helios-sof/R5", "helios-audit?/R5"]
R6 = ["helios-fhir/R6", "helios-fhirpath/R6", "helios-sof/R6", "helios-audit?/R6"]

[dependencies]
# Core dependencies (always included)
helios-fhir = { path = "../fhir", version = "0.2.0", default-features = false }
helios-fhirpath = { path = "../fhirpath", version = "0.2.0", default-features = false }
helios-fhirpath-support = { path = "../fhirpath-support", version = "0.2.0" }
# Shared SoF v2 spec parsing (ConstantValue, run-params extractor). Kept
# default-features = false so persistence can pick its own FHIR-version set.
helios-sof = { path = "../sof", version = "0.2.0", default-features = false }
rust_decimal = "1"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
regex = "1"
parking_lot = "0.12"
json-patch = "3"
humantime = "2"
futures = "0.3"
unicode-normalization = "0.1"

# SQLite backend
rusqlite = { version = "0.33", features = ["bundled", "serde_json", "functions"], optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2_sqlite = { version = "0.26", optional = true }

# PostgreSQL backend
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }
postgres-types = { version = "0.2", features = ["derive", "with-serde_json-1"], optional = true }

# Cassandra backend (using cdrs-tokio - pure Rust driver)
cdrs-tokio = { version = "8", optional = true }
cdrs-tokio-helpers-derive = { version = "5", optional = true }

# MongoDB backend
mongodb = { version = "3", optional = true }

# Neo4j backend
neo4rs = { version = "0.8", optional = true }

# Elasticsearch backend
elasticsearch = { version = "8.15.0-alpha.1", optional = true }

# S3 backend
# Disable default features to avoid the legacy `rustls` feature that pulls
# in vulnerable rustls 0.21 / rustls-webpki 0.101. `default-https-client`
# uses the modern rustls-aws-lc path instead.
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }

# Audit event integration
helios-audit = { path = "../audit", version = "0.2.0", optional = true, default-features = false }

# Configuration advisor HTTP server
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[package.metadata.docs.rs]
features = ["sqlite", "postgres", "elasticsearch", "mongodb"]
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "elastic_search", "minio"] }
paste = "1.0"

# `watchdog` pulls in `signal_hook::iterator`/`SIGQUIT`, which only compile on Unix.
# Windows test runs don't need SIGTERM cleanup, so drop the feature there.
[target.'cfg(not(windows))'.dev-dependencies]
testcontainers = { version = "0.27", features = ["watchdog"] }

[target.'cfg(windows)'.dev-dependencies]
testcontainers = { version = "0.27" }

# Configuration advisor binary
[[bin]]
name = "config-advisor"
path = "src/advisor/main.rs"
required-features = ["advisor"]

# Benchmarks will be added later
# [[bench]]
# name = "crud_benchmark"
# harness = false

# [[bench]]
# name = "search_benchmark"
# harness = false
