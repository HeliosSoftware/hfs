[package]
name = "helios-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/HeliosSoftware/hfs/tree/main/crates/web"
rust-version.workspace = true
description = "Server-rendered, HTMX-first web UI for the Helios FHIR Server"
keywords = ["helios-software", "fhir", "htmx", "web", "ui"]
categories = ["web-programming"]

[dependencies]
# Web framework — same major versions as helios-rest so the router can be
# mounted as a sub-router of the `hfs` binary without version skew.
axum = { version = "0.8", features = ["query"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Compile-time, type-checked templates (Jinja2-like). Auto-escapes HTML by
# default — see README for the templating trade-off rationale.
askama = "0.12"

# Query-string deserialization for the `Query` extractor.
serde = { workspace = true }

# Logging
tracing = "0.1"

[dev-dependencies]
# The `serve` example needs a runtime + a listener.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
