[workspace]
members = [
	"crates/*",
]
# Build all Rust crates by default, but skip pysof unless explicitly requested.
# This keeps `cargo build` working on machines without Python while still
# making `crates/pysof` an actual workspace member for maturin.
default-members = [
	"crates/fhir",
	"crates/fhir-gen",
	"crates/fhir-macro",
	"crates/fhirpath",
	"crates/fhirpath-support",
	"crates/serde",
	"crates/serde-support",
	"crates/hfs",
	"crates/ui",
	"crates/persistence",
	"crates/rest",
	"crates/web",
	"crates/sof",
	"crates/cds-hooks",
	"crates/hts",
	"crates/auth",
	"crates/audit",
	"crates/subscriptions",
	"crates/observability",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
authors = ["Helios Software"]
repository = "https://github.com/HeliosSoftware/hfs"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "=1.0.224", features = ["derive"] }
serde_json = "=1.0.144"
helios-fhir = { path = "crates/fhir", version = "0.2.1", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
