services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
      # Helios login theme (branded browser login). start-dev disables theme
      # caching, so edits under themes/ show up on the next page load.
      - ./themes:/opt/keycloak/themes:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9000/health/ready | grep -q UP || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
