# Helios login theme for Keycloak (classic FreeMarker login theme).
#
# Extends the stock `keycloak` login theme and layers Helios branding on top via
# CSS only — no template forks, so it keeps working across Keycloak upgrades.
# Palette and font mirror the HFS web UI (Figma "Dashboard V1.1"): Figtree,
# Helios accent #33b8ff, light surface. See crates/ui/assets/app.css.
parent=keycloak
import=common/keycloak

# Keep the parent stylesheet, then append ours so it wins the cascade.
styles=css/login.css css/helios.css
